/* xpf-fw0 effective config — expanded from docs/ha-cluster.conf with node0 group.
 * This file is NOT used by deploy (cluster-setup.sh pushes docs/ha-cluster.conf
 * with ${node} expansion). Kept as documentation of node 0's effective config. */
system {
    host-name xpf-fw0;
    name-server {
        1.1.1.1;
    }
}
chassis {
    cluster {
        cluster-id 1;
        # #6611: the cluster control channel (fabric gRPC, heartbeat,
        # session sync) authenticates with this shared PSK and fails OPEN
        # without it. LAB VALUE — generate your own per cluster with
        # `openssl rand -base64 32` and keep it identical on both nodes.
        authentication-key "xpf-lab-ha-psk-cluster-1-CHANGE-ME";
        node 0;
        reth-count 2;
        heartbeat-interval 200;
        heartbeat-threshold 5;
        control-interface fxp1;
        peer-address 10.99.0.2;
        fabric-interface fab0;
        fabric1-interface fab1;
        fabric-peer-address 10.99.1.2;
        fabric1-peer-address 10.99.2.2;
        configuration-synchronize;
        redundancy-group 0 {
            node 0 priority 200;
            node 1 priority 100;

        }
        redundancy-group 1 {
            node 0 priority 200;
            node 1 priority 100;

            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/1 weight 255;
                ge-7/0/1 weight 255;
            }
        }
        redundancy-group 2 {
            node 0 priority 200;
            node 1 priority 100;

            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/0 weight 255;
                ge-7/0/0 weight 255;
            }
        }
    }
}
interfaces {
    fxp0 {
        unit 0 { family inet { dhcp; } }
    }
    fxp1 {
        unit 0 { family inet { address 10.99.0.1/30; } }
    }
    fab0 {
        unit 0 { family inet { address 10.99.1.1/30; } }
    }
    fab1 {
        unit 0 { family inet { address 10.99.2.1/30; } }
    }
    ge-0/0/0 {
        gigether-options { redundant-parent reth1; }
    }
    ge-0/0/1 {
        gigether-options { redundant-parent reth0; }
    }
    reth0 {
        redundant-ether-options { redundancy-group 1; }
        vlan-tagging;
        unit 50 {
            vlan-id 50;
            family inet { address 172.16.50.6/24; }
            family inet6 { address 2001:559:8585:50::6/64; }
        }
        unit 100 {
            vlan-id 100;
            family inet { address 172.16.100.6/24; }
            family inet6 { address 2001:559:8585:100::6/64; }
        }
    }
    reth1 {
        redundant-ether-options { redundancy-group 2; }
        unit 0 {
            family inet { address 10.0.60.1/24; }
            family inet6 { address 2001:559:8585:cf01::1/64; }
        }
    }
}
security {
    flow { allow-dns-reply; allow-embedded-icmp; }
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic { system-services { ssh; ping; dhcp; } }
        }
        security-zone control {
            interfaces { fxp1; fab0; fab1; }
            host-inbound-traffic { system-services { all; } }
        }
        security-zone wan {
            interfaces { reth0.50; reth0.100; }
            host-inbound-traffic {
                system-services { ping; }
                protocols { router-discovery; }
            }
        }
        security-zone lan {
            interfaces {
                # #7490: `dhcp` is admitted PER INTERFACE here, not inherited
                # from the zone. reth1 runs the dhcp-local-server below, and xpf
                # now withholds a zone-level `dhcp`/`bootp` from a DHCP
                # server/relay interface -- Junos accepts those two tokens only
                # per interface, because the server must know the incoming
                # interface to send replies.
                #
                # This does NOT mean the server's requests were ever gated by
                # the token. They were not: a DHCPv4 DISCOVER/REQUEST reaches
                # Kea on an AF_PACKET socket ahead of netfilter and the XDP shim
                # passes the 255.255.255.255 broadcast straight to the kernel
                # (#6460, #8060, measured on hardware). The stanza is here so
                # the authorization is expressed where Junos expresses it, and
                # so anything else on this interface that needs udp/67-68
                # delivered to the host keeps working.
                #
                # A per-interface stanza REPLACES the zone stanza (#6515), so
                # the zone's other tokens are restated here on purpose; dropping
                # any of them would narrow this interface silently.
                reth1 {
                    host-inbound-traffic {
                        system-services { ssh; ping; dhcp; dhcpv6; }
                        protocols { router-discovery; }
                    }
                }
            }
            host-inbound-traffic {
                # The zone-level tokens are KEPT (#8060 non-goal): they still
                # apply to any future member that declares no stanza of its own,
                # and deleting `dhcp` here would be a narrowing #8060 argues is
                # worse than the comment it replaced. reth1 no longer relies on
                # them -- the per-interface stanza above REPLACES this one for
                # that interface (#6515).
                system-services { ssh; ping; dhcp; dhcpv6; }
                protocols { router-discovery; }
            }
        }
    }
    policies {
        default-policy deny-all;
        from-zone lan to-zone wan {
            policy allow-all {
                match { source-address any; destination-address any; application any; }
                then { permit; log { session-init; session-close; } }
            }
        }
    }
    nat {
        nat64 {
            rule-set v6-to-v4 {
                prefix 64:ff9b::/96;
                source-pool nat64-pool;
            }
        }
        proxy-arp {
            # nat64-snat-pool is a distinct WAN address (not the interface's
            # own .6), so the firewall must answer ARP for it on reth0.50 or
            # source-NAT return traffic blackholes. #16473: it sat on .7,
            # the loss legacy cluster's WAN RETH on the shared
            # 172.16.50.0/24 segment (docs/incus-tcp-udp-plan.md §3.3);
            # moved to legacy-local-only .12 and nat64-pool proxy-ARPed
            # alongside it (it previously had no ARP answerer at all).
            interface reth0.50 {
                address 172.16.50.12/32;
                address 172.16.50.9/32;
            }
        }
        source {
            # nat64-pool must ALSO avoid reth0.50's own address (.6). It sat on
            # .6 until #6751: the comment below already named .6 as the
            # colliding tuple and moved nat64-snat-pool off it, but nat64-pool
            # itself stayed on the interface address while lan-to-wan does
            # interface-mode source-NAT on that same interface — so the NAT64
            # allocator and interface-mode SNAT could both mint (172.16.50.6,
            # port) with no shared occupancy. The #5144 gate did not cover that
            # arm; #6751 adds it, and the strict validator rejects this file as
            # it stood.
            pool nat64-pool {
                address 172.16.50.9/32;
            }
            # nat64-snat source-NATs native lan->wan v4 traffic to its OWN pool
            # address, DISTINCT from the NAT64 v6->v4 source-pool. Sharing one
            # address across ANY two independently-keyed translation domains —
            # NAT64, source-NAT pools, AND interface-mode SNAT's egress
            # interface address (#6751) — lets both mint the same
            # (address, port) tuple, the #5144 reverse-index collision. The
            # commit gate rejects all three pairings; before #6751 it covered
            # only the pool-vs-pool and pool-vs-NAT64 arms, so a pool sitting on
            # an interface-mode egress address passed.
            pool nat64-snat-pool {
                address 172.16.50.12/32;
            }
            rule-set nat64-snat {
                from zone lan;
                to zone wan;
                rule nat64 {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { pool nat64-snat-pool; } }
                }
            }
            rule-set lan-to-wan {
                from zone lan;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
        }
    }
}
protocols {
    router-advertisement {
        interface reth1 {
            managed-configuration;
            other-stateful-configuration;
            prefix 2001:559:8585:cf01::/64 {
                on-link;
                autonomous;
            }
            dns-server-address 2001:4860:4860::8888;
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 { next-hop 172.16.50.1; }
        route ::/0 { next-hop 2001:559:8585:50::1; }
    }
}
system {
    services {
        dhcp-local-server {
            group lan-pool {
                interface reth1;
                pool lan-range {
                    subnet 10.0.60.0/24;
                    address-range low 10.0.60.100 high 10.0.60.199;
                    router 10.0.60.1;
                    dns-server 8.8.8.8;
                }
            }
        }
        dhcpv6-local-server {
            group lan6-pool {
                interface reth1;
                pool lan6-range {
                    subnet 2001:559:8585:cf01::/64;
                    address-range low 2001:559:8585:cf01::100 high 2001:559:8585:cf01::1ff;
                    dns-server 2001:4860:4860::8888;
                }
            }
        }
    }
}
