interfaces {
    fxp0 {
        unit 0 {
            family inet {
                dhcp;
            }
        }
    }
    ge-0/0/0 {
        unit 0 {
            family inet {
                address 10.0.1.10/24;
            }
            family inet6 {
                address 2001:559:8585:bf01::1/64;
                address fd01:0203:0405:bf01::1/64;
            }
        }
    }
    ge-0/0/1 {
        unit 0 {
            family inet {
                address 10.0.2.10/24;
                filter {
                    input dscp-filter;
                }
            }
            family inet6 {
                address 2001:559:8585:bf02::1/64;
                address fd01:0203:0405:bf02::1/64;
                filter {
                    input block-ra;
                }
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            family inet {
                address 10.0.30.10/24;
            }
            family inet6 {
                address 2001:559:8585:bf03::1/64;
            }
        }
    }
    ge-0/0/3 {
        vlan-tagging;
        unit 50 {
            vlan-id 50;
            family inet {
                address 172.16.50.5/24;
            }
            family inet6 {
                address 2001:559:8585:50::5/64;
            }
        }
    }
    ge-0/0/4 {
        unit 0 {
            family inet {
                address 10.100.100.1/24;
            }
        }
    }
}
security {
    flow {
        tcp-mss {
            all-tcp 1350;
        }
        allow-dns-reply;
        allow-embedded-icmp;
    }
    alg {
        dns { disable; }
        ftp { disable; }
    }
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic {
                system-services { ssh; ping; dhcp; }
            }
        }
        security-zone trust {
            interfaces { ge-0/0/0; }
            host-inbound-traffic {
                system-services { ssh; ping; dhcp; dhcpv6; }
            }
        }
        security-zone untrust {
            tcp-rst;
            interfaces { ge-0/0/1; }
            host-inbound-traffic {
                system-services { ping; dhcp; dhcpv6; }
            }
        }
        security-zone dmz {
            interfaces { ge-0/0/2; }
            host-inbound-traffic {
                system-services { ssh; ping; dhcp; dhcpv6; }
            }
        }
        security-zone wan {
            interfaces { ge-0/0/3.50; }
            host-inbound-traffic {
                system-services { ping; }
            }
        }
        security-zone loss {
            interfaces { ge-0/0/4; }
            host-inbound-traffic {
                system-services { ping; }
            }
        }
    }
    policies {
        default-policy deny-all;
        from-zone trust to-zone untrust {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; log { session-init; session-close; } }
            }
        }
        from-zone trust to-zone dmz {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        from-zone untrust to-zone trust {
            policy allow-dnat-web {
                match {
                    source-address any;
                    destination-address any;
                    application junos-http;
                }
                then { permit; log { session-init; session-close; } }
            }
            policy allow-icmp {
                match {
                    source-address any;
                    destination-address any;
                    application [ junos-ping junos-pingv6 ];
                }
                then { permit; }
            }
            policy reject-rest {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { reject; }
            }
        }
        from-zone untrust to-zone dmz {
            policy allow-web {
                match {
                    source-address any;
                    destination-address any;
                    application junos-http;
                }
                then { permit; }
            }
        }
        from-zone trust to-zone wan {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; log { session-init; } }
            }
        }
        from-zone untrust to-zone wan {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        from-zone dmz to-zone wan {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        from-zone trust to-zone loss {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        from-zone untrust to-zone loss {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        from-zone dmz to-zone loss {
            policy allow-all {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then { permit; }
            }
        }
        global {
            policy default-log-deny {
                description "Log and deny all unmatched traffic";
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log { session-init; }
                }
            }
        }
    }
    nat {
        nat64 {
            rule-set v6-to-v4 {
                prefix 64:ff9b::/96;
                source-pool nat64-pool;
            }
        }
        proxy-arp {
            # nat64-snat-pool (.15) and nat64-pool (.14) are distinct WAN
            # addresses (not the interface's own .5), so the firewall must
            # answer ARP for both on ge-0/0/3.50 or NAT64 / source-NAT
            # return traffic blackholes. #16473: .15/.14 are standalone-only
            # allocations on the shared 172.16.50.0/24 segment (docs/
            # incus-tcp-udp-plan.md §3.3) — .6 is the legacy local cluster's
            # WAN RETH and .11 is the udp cluster's WAN RETH, so proxy-ARP
            # for either would ARP-fight a co-running stack.
            interface ge-0/0/3.50 {
                address 172.16.50.15/32;
                address 172.16.50.14/32;
            }
        }
        source {
            # nat64-pool must ALSO avoid ge-0/0/3.50's own address (.5). It sat
            # on .5 until #6751 — the same slip as the sibling comment below
            # warns about, one domain over: trust-to-wan does interface-mode
            # source-NAT to zone wan, ge-0/0/3.50 IS zone wan and owns .5, so
            # the NAT64 allocator and interface-mode SNAT could both mint
            # (172.16.50.5, port) with no shared occupancy. The #5144 gate did
            # not cover the interface-mode arm; #6751 adds it.
            pool nat64-pool {
                address 172.16.50.14/32;
            }
            # nat64-snat source-NATs native untrust->wan v4 traffic to its OWN
            # pool address, DISTINCT from the NAT64 v6->v4 source-pool. Sharing
            # one address across ANY two independently-keyed translation
            # domains — NAT64, source-NAT pools, AND interface-mode SNAT's
            # egress interface address (#6751) — lets both mint the same
            # (address, port) tuple, the #5144 reverse-index collision. The
            # commit gate rejects all three pairings; before #6751 it covered
            # only the pool-vs-pool and pool-vs-NAT64 arms.
            pool nat64-snat-pool {
                address 172.16.50.15/32;
            }
            rule-set nat64-snat {
                from zone untrust;
                to zone wan;
                rule nat64 {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { pool nat64-snat-pool; } }
                }
            }
            rule-set trust-to-untrust {
                from zone trust;
                to zone untrust;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set trust-to-wan {
                from zone trust;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set untrust-to-wan {
                from zone untrust;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set dmz-to-wan {
                from zone dmz;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set trust-to-loss {
                from zone trust;
                to zone loss;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set untrust-to-loss {
                from zone untrust;
                to zone loss;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
            rule-set dmz-to-loss {
                from zone dmz;
                to zone loss;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
        }
        destination {
            pool web-server {
                address 10.0.1.100/32;
                port 80;
            }
            pool web-server-v6 {
                address 2001:559:8585:bf01::100/128;
                port 80;
            }
            rule-set untrust-dnat {
                from zone untrust;
                rule web {
                    match {
                        destination-address 10.0.2.10/32;
                        destination-port 8080;
                    }
                    then { destination-nat pool web-server; }
                }
                rule web-v6 {
                    match {
                        destination-address 2001:559:8585:bf02::1/128;
                        destination-port 8080;
                    }
                    then { destination-nat pool web-server-v6; }
                }
            }
        }
        static {
            rule-set nptv6-trust {
                from zone trust;
                rule ula-to-global {
                    match {
                        destination-address 2001:559:8585:bf04::/64;
                    }
                    then {
                        static-nat {
                            nptv6-prefix {
                                fd01:0203:0405:bf01::/64;
                            }
                        }
                    }
                }
            }
            rule-set nptv6-untrust {
                from zone untrust;
                rule ula-to-global {
                    match {
                        destination-address 2001:559:8585:bf05::/64;
                    }
                    then {
                        static-nat {
                            nptv6-prefix {
                                fd01:0203:0405:bf02::/64;
                            }
                        }
                    }
                }
            }
        }
    }
    screen {
        ids-option untrust-screen {
            tcp { land; syn-flood; }
            icmp { ping-death; }
            ip { source-route-option; }
        }
    }
}
firewall {
    family inet {
        filter dscp-filter {
            term mark-ef {
                from {
                    dscp ef;
                }
                then accept;
            }
            term block-ssh {
                from {
                    protocol tcp;
                    destination-port 22;
                }
                then {
                    log;
                    discard;
                }
            }
            term default {
                then accept;
            }
        }
    }
    family inet6 {
        filter block-ra {
            term block-ra-adv {
                from {
                    icmp-type 134;
                    icmp-code 0;
                }
                then discard;
            }
            term allow-all {
                then accept;
            }
        }
    }
}
routing-instances {
    dmz-vr {
        instance-type virtual-router;
        interface ge-0/0/2;
        routing-options {
            interface-routes {
                rib-group inet dmz-leak;
            }
            static {
                route 0.0.0.0/0 { next-hop 10.0.30.1; }
            }
        }
    }
}
routing-options {
    rib-groups {
        dmz-leak {
            import-rib [ dmz-vr.inet.0 inet.0 ];
        }
    }
    static {
        route 0.0.0.0/0 { next-hop 172.16.50.1; }
        route ::/0 {
            next-hop fe80::50 {
                interface ge-0/0/3.50;
            }
        }
    }
}
protocols {
    router-advertisement {
        interface ge-0/0/0 {
            managed-configuration;
            other-stateful-configuration;
            prefix 2001:559:8585:bf01::/64 {
                on-link;
                autonomous;
            }
            prefix fd01:0203:0405:bf01::/64 {
                on-link;
                autonomous;
            }
            dns-server-address 2001:4860:4860::8888;
            dns-server-address 2001:4860:4860::8844;
        }
        interface ge-0/0/1 {
            managed-configuration;
            other-stateful-configuration;
            prefix 2001:559:8585:bf02::/64 {
                on-link;
                autonomous;
            }
            prefix fd01:0203:0405:bf02::/64 {
                on-link;
                autonomous;
            }
            nat64prefix 64:ff9b::/96;
            dns-server-address 2001:4860:4860::8888;
            dns-server-address 2001:4860:4860::8844;
        }
        interface ge-0/0/2 {
            managed-configuration;
            other-stateful-configuration;
            prefix 2001:559:8585:bf03::/64 {
                on-link;
                autonomous;
            }
            dns-server-address 2001:4860:4860::8888;
            dns-server-address 2001:4860:4860::8844;
        }
    }
}
services {
    rpm {
        probe isp-health {
            test icmp-check {
                probe-type icmp-ping;
                target 10.0.2.1;
                probe-interval 5;
                test-interval 30;
                thresholds {
                    successive-loss 3;
                }
            }
        }
    }
    flow-monitoring {
        version9 {
            template v9-flow {
                flow-active-timeout 60;
                flow-inactive-timeout 15;
                template-refresh-rate {
                    seconds 60;
                }
            }
        }
    }
}
event-options {
    policy failover-on-probe-fail {
        events [ ping_test_failed ];
        within 60 {
            trigger on 1;
        }
        attributes-match {
            ping_test_failed.test-owner matches isp-health;
            ping_test_failed.test-name matches icmp-check;
        }
        then {
            change-configuration {
                commands {
                    "set routing-options static route 192.168.222.0/24 discard";
                }
            }
        }
    }
    policy restore-on-probe-success {
        events ping_test_completed;
        within 60 {
            trigger on 1;
        }
        attributes-match {
            ping_test_completed.test-owner matches isp-health;
            ping_test_completed.test-name matches icmp-check;
        }
        then {
            change-configuration {
                commands {
                    "delete routing-options static route 192.168.222.0/24";
                }
            }
        }
    }
}
system {
    name-server {
        1.1.1.1;
    }
    services {
        dhcp-local-server {
            group trust-pool {
                interface ge-0/0/0;
                pool trust-range {
                    subnet 10.0.1.0/24;
                    address-range low 10.0.1.100 high 10.0.1.199;
                    router 10.0.1.10;
                    dns-server 8.8.8.8;
                }
            }
            group untrust-pool {
                interface ge-0/0/1;
                pool untrust-range {
                    subnet 10.0.2.0/24;
                    address-range low 10.0.2.100 high 10.0.2.199;
                    router 10.0.2.10;
                    dns-server 8.8.8.8;
                }
            }
            group dmz-pool {
                interface ge-0/0/2;
                pool dmz-range {
                    subnet 10.0.30.0/24;
                    address-range low 10.0.30.100 high 10.0.30.199;
                    router 10.0.30.10;
                    dns-server 8.8.8.8;
                }
            }
        }
        dhcpv6-local-server {
            group trust-pool6 {
                interface ge-0/0/0;
                pool trust-range6 {
                    subnet 2001:559:8585:bf01::/64;
                    address-range low 2001:559:8585:bf01::100 high 2001:559:8585:bf01::1ff;
                    dns-server 2001:4860:4860::8888;
                    dns-server 2001:4860:4860::8844;
                }
            }
            group untrust-pool6 {
                interface ge-0/0/1;
                pool untrust-range6 {
                    subnet 2001:559:8585:bf02::/64;
                    address-range low 2001:559:8585:bf02::100 high 2001:559:8585:bf02::1ff;
                    dns-server 2001:4860:4860::8888;
                    dns-server 2001:4860:4860::8844;
                }
            }
            group dmz-pool6 {
                interface ge-0/0/2;
                pool dmz-range6 {
                    subnet 2001:559:8585:bf03::/64;
                    address-range low 2001:559:8585:bf03::100 high 2001:559:8585:bf03::1ff;
                    dns-server 2001:4860:4860::8888;
                    dns-server 2001:4860:4860::8844;
                }
            }
        }
    }
    snmp {
        description "xpf test firewall";
        location "lab";
        contact "admin@test.local";
        community public {
            authorization read-only;
        }
    }
    backup-router 10.0.1.1 destination 10.0.0.0/8;
}
forwarding-options {
    sampling {
        instance jf-instance {
            input {
                rate 1;
            }
            family inet {
                output {
                    flow-server 192.168.99.104 {
                        port 4739;
                        version9-template v9-flow;
                    }
                    inline-jflow;
                }
            }
            family inet6 {
                output {
                    flow-server 192.168.99.104 {
                        port 4739;
                        version9-template v9-flow;
                    }
                    inline-jflow;
                }
            }
        }
    }
}
