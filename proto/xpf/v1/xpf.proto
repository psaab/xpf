syntax = "proto3";

package xpf.v1;

option go_package = "github.com/psaab/xpf/pkg/grpcapi/xpfv1";

// BpfrxService provides gRPC access to the xpf firewall daemon.
service BpfrxService {
  // Config lifecycle
  rpc EnterConfigure(EnterConfigureRequest) returns (EnterConfigureResponse);
  rpc ExitConfigure(ExitConfigureRequest) returns (ExitConfigureResponse);
  rpc GetConfigModeStatus(GetConfigModeStatusRequest) returns (GetConfigModeStatusResponse);
  rpc Set(SetRequest) returns (SetResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Load(LoadRequest) returns (LoadResponse);
  rpc Commit(CommitRequest) returns (CommitResponse);
  rpc CommitCheck(CommitCheckRequest) returns (CommitCheckResponse);
  rpc CommitConfirmed(CommitConfirmedRequest) returns (CommitConfirmedResponse);
  rpc ConfirmCommit(ConfirmCommitRequest) returns (ConfirmCommitResponse);
  rpc Rollback(RollbackRequest) returns (RollbackResponse);
  rpc ShowConfig(ShowConfigRequest) returns (ShowConfigResponse);
  rpc ShowCompare(ShowCompareRequest) returns (ShowCompareResponse);
  rpc ShowRollback(ShowRollbackRequest) returns (ShowRollbackResponse);
  rpc ListHistory(ListHistoryRequest) returns (ListHistoryResponse);

  // Operational show RPCs
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  rpc GetGlobalStats(GetGlobalStatsRequest) returns (GetGlobalStatsResponse);
  rpc GetZones(GetZonesRequest) returns (GetZonesResponse);
  rpc GetPolicies(GetPoliciesRequest) returns (GetPoliciesResponse);
  rpc GetSessions(GetSessionsRequest) returns (GetSessionsResponse);
  rpc GetSessionSummary(GetSessionSummaryRequest) returns (GetSessionSummaryResponse);
  rpc GetZonePairSummary(GetZonePairSummaryRequest) returns (GetZonePairSummaryResponse);
  rpc GetNATSource(GetNATSourceRequest) returns (GetNATSourceResponse);
  rpc GetNATDestination(GetNATDestinationRequest) returns (GetNATDestinationResponse);
  rpc GetScreen(GetScreenRequest) returns (GetScreenResponse);
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
  rpc GetD11AttestationLedger(GetD11AttestationLedgerRequest) returns (GetD11AttestationLedgerResponse);
  rpc GetInterfaces(GetInterfacesRequest) returns (GetInterfacesResponse);
  rpc ShowInterfacesDetail(ShowInterfacesDetailRequest) returns (ShowInterfacesDetailResponse);
  rpc GetDHCPLeases(GetDHCPLeasesRequest) returns (GetDHCPLeasesResponse);
  rpc GetDHCPClientIdentifiers(GetDHCPClientIdentifiersRequest) returns (GetDHCPClientIdentifiersResponse);
  rpc GetRoutes(GetRoutesRequest) returns (GetRoutesResponse);
  rpc GetOSPFStatus(GetOSPFStatusRequest) returns (GetOSPFStatusResponse);
  rpc GetBGPStatus(GetBGPStatusRequest) returns (GetBGPStatusResponse);
  rpc GetRIPStatus(GetRIPStatusRequest) returns (GetRIPStatusResponse);
  rpc GetISISStatus(GetISISStatusRequest) returns (GetISISStatusResponse);
  rpc GetIPsecSA(GetIPsecSARequest) returns (GetIPsecSAResponse);
  rpc GetNATPoolStats(GetNATPoolStatsRequest) returns (GetNATPoolStatsResponse);
  rpc GetNATRuleStats(GetNATRuleStatsRequest) returns (GetNATRuleStatsResponse);
  rpc GetNATDeterministic(GetNATDeterministicRequest) returns (GetNATDeterministicResponse);
  rpc GetVRRPStatus(GetVRRPStatusRequest) returns (GetVRRPStatusResponse);
  rpc MatchPolicies(MatchPoliciesRequest) returns (MatchPoliciesResponse);

  // Diagnostics (server-streaming for real-time output)
  rpc Ping(PingRequest) returns (stream PingResponse);
  rpc Traceroute(TracerouteRequest) returns (stream TracerouteResponse);

  // Monitor (server-streaming)
  rpc MonitorPacketDrop(MonitorPacketDropRequest) returns (stream MonitorPacketDropResponse);
  rpc MonitorInterface(MonitorInterfaceRequest) returns (stream MonitorInterfaceResponse);

  // Mutations
  rpc ClearSessions(ClearSessionsRequest) returns (ClearSessionsResponse);
  rpc ClearCounters(ClearCountersRequest) returns (ClearCountersResponse);
  rpc ClearDHCPClientIdentifier(ClearDHCPClientIdentifierRequest) returns (ClearDHCPClientIdentifierResponse);

  // Generic text show (schedulers, snmp, dhcp-relay, firewall, alg, etc.)
  rpc ShowText(ShowTextRequest) returns (ShowTextResponse);

  // System info (uptime, memory)
  rpc GetSystemInfo(GetSystemInfoRequest) returns (GetSystemInfoResponse);

  // System actions (reboot, halt)
  rpc SystemAction(SystemActionRequest) returns (SystemActionResponse);

  // Tab completion
  rpc Complete(CompleteRequest) returns (CompleteResponse);
}

// --- Config lifecycle messages ---

message EnterConfigureRequest {
  bool exclusive = 1;
}
message EnterConfigureResponse {}

message ExitConfigureRequest {}
message ExitConfigureResponse {}

message GetConfigModeStatusRequest {}
message GetConfigModeStatusResponse {
  bool in_config_mode = 1;
  bool dirty = 2;
  bool confirm_pending = 3;
}

message SetRequest { string input = 1; }
message SetResponse {}

message DeleteRequest { string input = 1; }
message DeleteResponse {}

message LoadRequest {
  string mode = 1;    // "override", "merge", or "set" (#2052: set replays flat set/delete/deactivate/activate lines)
  string content = 2; // full config text (hierarchical or set format)
}
message LoadResponse {}

message CommitRequest {
  string comment = 1; // optional commit comment/description
}
message CommitResponse {
  string summary = 1; // human-readable diff summary (e.g. "3 statement(s) changed (2 added, 1 removed)")
  repeated string warnings = 2; // non-fatal validation warnings surfaced at commit time
}

message CommitCheckRequest {}
message CommitCheckResponse {
  repeated string warnings = 1; // non-fatal validation warnings surfaced by commit check
}

message CommitConfirmedRequest { int32 minutes = 1; }
message CommitConfirmedResponse {
  repeated string warnings = 1; // non-fatal validation warnings surfaced at commit-confirmed time
}

message ConfirmCommitRequest {}
message ConfirmCommitResponse {}

message RollbackRequest { int32 n = 1; }
message RollbackResponse {}

enum ConfigFormat {
  HIERARCHICAL = 0;
  SET = 1;
  JSON = 2;
  XML = 3;
  INHERITANCE = 4;
}

enum ConfigTarget {
  CANDIDATE = 0;
  ACTIVE = 1;
}

enum MonitorInterfaceSummaryMode {
  MONITOR_INTERFACE_SUMMARY_MODE_COMBINED = 0;
  MONITOR_INTERFACE_SUMMARY_MODE_PACKETS = 1;
  MONITOR_INTERFACE_SUMMARY_MODE_BYTES = 2;
  MONITOR_INTERFACE_SUMMARY_MODE_DELTA = 3;
  MONITOR_INTERFACE_SUMMARY_MODE_RATE = 4;
}

message ShowConfigRequest {
  ConfigFormat format = 1;
  ConfigTarget target = 2;
  repeated string path = 3; // optional path to filter config subtree
}
message ShowConfigResponse { string output = 1; }

message ShowCompareRequest {
  int32 rollback_n = 1;  // 0 = compare candidate vs active
}
message ShowCompareResponse { string output = 1; }

message ShowRollbackRequest {
  int32 n = 1;
  ConfigFormat format = 2;
}
message ShowRollbackResponse { string output = 1; }

message ListHistoryRequest {}
message ListHistoryResponse {
  repeated HistoryEntry entries = 1;
}
message HistoryEntry {
  int32 index = 1;
  string timestamp = 2;
}

// --- Operational messages ---

message GetStatusRequest {}
message GetStatusResponse {
  string uptime = 1;
  bool dataplane_loaded = 2;
  bool config_loaded = 3;
  int32 zone_count = 4;
  int32 session_count = 5;
  // Cluster status (empty string if not in a cluster)
  string cluster_role = 6;  // "primary" or "secondary"
  int32 cluster_node_id = 7; // node ID (0, 1, ...)
}

message GetD11AttestationLedgerRequest {}
message GetD11AttestationLedgerResponse {
  string node_id = 1;
  string run_id = 2;
  uint64 permit_epoch = 3;
  uint64 snapshot_seq = 4;
  bool finalized = 5;
  bool truncated = 6;
  repeated D11LedgerRecord records = 7;
  repeated D11LedgerFailure failures = 8;
}
message D11LedgerRecord {
  string node_id = 1;
  uint64 request_id = 2;
  uint64 permit_epoch = 3;
  uint64 queue_epoch = 4;
  uint32 queue_number = 5;
  string family = 6;
  string hook = 7;
  string owner = 8;
  string stn = 9;
  uint32 owned_ifindex = 10;
  bytes frame_digest = 11;
  string admission_code = 12;
  string completion = 13;
  uint64 resolve_count = 14;
  string terminal_state = 15;
  uint64 late_attempts = 16;
  bool duplicate = 17;
  bool contract_refusal = 18;
  string early_outcome = 19;
  string early_reason = 20;
  uint32 early_bytes_written = 21;
}
message D11LedgerFailure {
  string family = 1;
  string hook = 2;
  string owner = 3;
  string stn = 4;
  uint32 owned_ifindex = 5;
  bytes frame_digest = 6;
  string reason = 7;
}

message GetGlobalStatsRequest {}
message GetGlobalStatsResponse {
  uint64 rx_packets = 1;
  uint64 tx_packets = 2;
  uint64 drops = 3;
  uint64 sessions_created = 4;
  uint64 sessions_closed = 5;
  uint64 screen_drops = 6;
  uint64 policy_denies = 7;
  uint64 nat_alloc_failures = 8;
  uint64 host_inbound_denies = 9;
  uint64 tc_egress_packets = 10;
  uint64 nat64_translations = 11;
  uint64 host_inbound_allowed = 12;
  map<string, uint64> screen_drop_details = 13;
  uint64 unknown_vlan_drops = 14;
  uint64 dst_mac_drops = 15;
}

message GetZonesRequest {}
message GetZonesResponse {
  repeated ZoneInfo zones = 1;
}
// ZoneCounterAvailability reports whether the server had a per-zone traffic
// reading for a zone, so a client can tell a real counter from the absence of
// one (#6895).
//
// UNKNOWN IS 0 ON PURPOSE, and it is the whole point of this being an enum
// rather than a bool. proto3 has no field presence for scalars: a `bool
// per_zone_counters_available` sent by an OLD server decodes to `false` on a new
// client, which is indistinguishable from the server saying "unavailable" — so
// every zone from an old server, including ones with real counters, would render
// as unavailable. The inverted spelling has the mirror-image defect: absent
// decodes to "available" and an unpopulated zone renders as a real 0.
//
// With UNKNOWN = 0 the skewed pair is honest by construction: a new client
// talking to an old server sees UNKNOWN and renders exactly as it did before
// #6895, introducing no new wrong answer in either direction.
enum ZoneCounterAvailability {
  // The server did not say. An old server omits the field entirely and it
  // decodes here. Clients MUST fall back to their pre-#6895 rendering.
  ZONE_COUNTER_AVAILABILITY_UNKNOWN = 0;
  // The server read live per-zone volume; the counter fields are real.
  ZONE_COUNTER_AVAILABILITY_AVAILABLE = 1;
  // The dataplane published no per-zone volume for this zone, so the counter
  // fields are meaningless zeros. Note this does NOT isolate an idle zone: the
  // helper's status snapshot omits all-zero rows, so a pre-#3651 helper, a zone
  // past hot-path slot capacity, and a merely idle zone all land here.
  ZONE_COUNTER_AVAILABILITY_UNAVAILABLE = 2;
}

message ZoneInfo {
  string name = 1;
  uint32 id = 2;
  string screen_profile = 3;
  repeated string interfaces = 4;
  // host_inbound_services is the LEGACY flattened admission set:
  // system-services + protocols concatenated into one list. Kept as a
  // back-compat alias; new consumers should read the split fields below.
  repeated string host_inbound_services = 5;
  uint64 ingress_packets = 6;
  uint64 ingress_bytes = 7;
  uint64 egress_packets = 8;
  uint64 egress_bytes = 9;
  bool tcp_rst = 10;
  string description = 11;
  // host_inbound_configured (#3328/#3405) records whether the zone is
  // host-inbound ENFORCING. Post-#3405 EVERY configured security zone is
  // enforcing (Junos default-deny parity), so this is the dataplane posture
  // bit (ZoneSnapshot.HostInboundConfigured) and is TRUE for every zone this
  // RPC returns. A zone with NO `host-inbound-traffic` stanza default-DENIES
  // host-bound traffic exactly like an explicit empty stanza (deny-all) —
  // there is no admit-all posture for a configured zone. The admitted set
  // lives in host_inbound_system_services / host_inbound_protocols (empty =
  // deny-all) plus any per-interface override in interface_host_inbound.
  // Before #3653 this was re-derived from config shape and reported false for
  // a no-stanza zone — the pre-#3405 "false = admit-all" reading, the OPPOSITE
  // of runtime. (Global ICMP/ND/PMTUD accepts and lifeline interfaces
  // fxp0/em0/fab* still bypass the per-zone host-inbound deny.)
  bool host_inbound_configured = 12;
  // host_inbound_system_services / host_inbound_protocols (#3328) carry the
  // ZONE-LEVEL admission set, kept distinct so automation can tell a
  // system-service (ssh, ping, dhcp) apart from a routing protocol (ospf,
  // bgp). Empty when the zone has no zone-level stanza (e.g. host-inbound is
  // expressed only via per-interface overrides below).
  repeated string host_inbound_system_services = 13;
  repeated string host_inbound_protocols = 14;
  // interface_host_inbound (#3328, #3362) carries per-interface host-inbound
  // overrides. An entry exists only for an interface that declares its own
  // `host-inbound-traffic` stanza; the effective admission set for that
  // interface IS the override — it REPLACES the zone-level set above (#6515).
  repeated InterfaceHostInbound interface_host_inbound = 15;
  // lifeline_interfaces (#3682) lists the zone's interfaces that are
  // management / cluster-control LIFELINES (fxp0 / em0 / fab* / configured
  // control-interface / fabric-interface) and are therefore EXCLUDED from this
  // zone's host-inbound deny scoping — their host-bound traffic is always
  // admitted regardless of the admission set above. Surfaced so the implicit
  // management-plane exception is operator-visible and auditable rather than a
  // silent bypass. Sorted, deduplicated; empty for a zone with no lifeline
  // member. VISIBILITY only — the exemption semantics are unchanged.
  repeated string lifeline_interfaces = 16;
  // per_zone_counter_availability (#6895) tells the client whether the four
  // counter fields above are a real reading or the absence of one. Before it,
  // the remote cli omitted the traffic section whenever both packet counts were
  // zero, so a zone whose counters are unavailable rendered identically to an
  // idle one — silence that reads as "no traffic", which is a wrong answer
  // rather than a missing one.
  ZoneCounterAvailability per_zone_counter_availability = 17;
  // quarantine_state (#10531) tells a structured client whether this zone is
  // excluded by StableZoneID collision quarantine. NOT_QUARANTINED means the
  // collision verdict did not exclude it; it does not assert that the
  // dataplane is loaded or has applied the zone. UNKNOWN=0 means an old server
  // omitted the field; clients MUST fall back to their pre-#10531 rendering
  // rather than treating absence as a clean verdict.
  ZoneQuarantineState quarantine_state = 18;
  // quarantine_survivor_zone is set only when quarantine_state is
  // QUARANTINED. It names the earlier-sorting zone that owns the shared
  // StableZoneID. It is empty for UNKNOWN and NOT_QUARANTINED.
  string quarantine_survivor_zone = 19;
}

// InterfaceHostInbound (#3328, #3362) is a per-interface host-inbound-traffic
// override: a zone may expose a service (e.g. ssh) on one interface while
// denying it on the others. `configured` is always true for an emitted entry
// (the stanza is present); empty service/protocol lists with configured=true
// mean an explicit deny-all override on that interface.
message InterfaceHostInbound {
  string interface = 1;
  bool configured = 2;
  repeated string system_services = 3;
  repeated string protocols = 4;
}

message GetPoliciesRequest {}
message GetPoliciesResponse {
  repeated PolicyInfo policies = 1;
  // policy_stats_enabled reports `set security policy-stats system-wide
  // enable` (#8177). It is the SECOND input of the per-rule eligibility gate,
  // which is `statsEnabled || rule.count`; before this only `count` was on the
  // wire, so two states rendered byte-identically:
  //
  //   A  stats ON,  count=false -> the counter WAS read; 0 means no traffic
  //   B  stats OFF, count=false -> the counter was never read; 0 means nothing
  //
  // Both emit count=false, hit_counters_unavailable=false, hit_packets=0. A
  // consumer could not tell an authoritative zero from an unmeasured one, which
  // is the defect #7776 fixed on the text surfaces and left on these.
  //
  // ADDITIVE, and deliberately NOT a redefinition of either existing flag.
  // hit_counters_unavailable keeps its documented meaning — counter-ELIGIBLE
  // but no source answered — and count=false keeps signalling not-eligible.
  // Setting hit_counters_unavailable for case B was the tempting shortcut and
  // would contradict that shipped contract, lying to exactly the consumer that
  // implemented the stated split correctly.
  //
  // System-wide rather than per-rule because the knob is: it is one field on
  // the response, not a bool repeated across every rule. False on an older
  // server, which reads the same as "stats off" — the conservative direction,
  // since a consumer that treats an unmeasured zero as unmeasured loses
  // nothing, while the reverse invents a measurement.
  bool policy_stats_enabled = 2;
}
message PolicyInfo {
  string from_zone = 1;
  string to_zone = 2;
  repeated PolicyRule rules = 3;
}
message PolicyRule {
  string name = 1;
  string action = 2;
  repeated string src_addresses = 3;
  repeated string dst_addresses = 4;
  repeated string applications = 5;
  bool log = 6;
  bool count = 7;
  uint64 hit_packets = 8;
  uint64 hit_bytes = 9;
  string description = 10;
  // match_from_zone / match_to_zone carry the optional from-zone/to-zone
  // match context of a scoped GLOBAL policy (#3148). Empty for an
  // all-zones global policy and for ordinary zone-pair rules (whose zones
  // come from the enclosing PolicyInfo from_zone/to_zone). #3286: surfaces
  // the configured zone scope so a scoped global is not shown as all-zones.
  string match_from_zone = 11;
  string match_to_zone = 12;
  // #3336: match-inversion flags. source_address_excluded /
  // destination_address_excluded invert the corresponding address match sense
  // (Junos `source-address-excluded` / `destination-address-excluded`): the
  // rule matches every address EXCEPT those listed. The flags exist end-to-end
  // (config -> snapshot -> dataplane) but were never surfaced on the inventory
  // API, so an audit reading src_addresses/dst_addresses saw the rule's meaning
  // INVERTED. Additive; false (omitted) for a rule without the modifier.
  bool source_address_excluded = 13;
  bool destination_address_excluded = 14;
  // #3336: per-policy `then log session-init` / `session-close` selection. The
  // `log` bool above collapses both to one flag, so init-only, close-only, and
  // both render identically. These expose the independent modes the config and
  // snapshot already carry. Additive; false (omitted) when unset.
  bool log_session_init = 15;
  bool log_session_close = 16;
  // #3336: runtime identity. policy_id is the span-accumulated runtime/RT_FLOW
  // policy ID (matches the ID events expose); rule_id is the stable
  // "<from>-><to>/<name>" string the snapshot carries. They let automation join
  // a runtime event (policy_id=N) back to this inventory row.
  //
  // #3623: proto3 EXPLICIT PRESENCE. The first rule of the first zone-pair set
  // has runtime id 0 (policySetID*MaxRulesPerPolicy + ruleIndex = 0*256 + 0),
  // and since #3057 the implicit default policy uses a distinct sentinel
  // (0xFFFFFFFF), so id 0 is UNAMBIGUOUSLY a real policy. A bare proto3 scalar
  // omits the zero value on the wire, so a generic JSON/proto client could not
  // distinguish "first policy, id 0" from "field unset" and dropped the join
  // key for the highest-priority rule. `optional` restores presence: the
  // inventory always sets policy_id, so it is always present (even at 0).
  optional uint32 policy_id = 17;
  string rule_id = 18;
  // #3624: scheduler binding + runtime scheduler state, the structured
  // sibling of the #3062 TEXT policy-detail surface. scheduler_name is the
  // policy's configured `scheduler-name` (Junos scheduled policy); empty for
  // an always-on rule. inactive is true when the policy is bound to a
  // scheduler that is currently runtime-inactive, i.e. the dataplane is
  // skipping the rule right now (mirrors the text "State: inactive" token).
  // Without these a structured audit reads a time-gated, currently-dormant
  // permit/deny as an active allow/deny, disagreeing with effective dataplane
  // behavior. Both are additive; empty/false for the common always-on rule
  // and (like the text surface) inactive stays false when live scheduler
  // state cannot be queried, so the output is unchanged for existing clients.
  string scheduler_name = 19;
  bool inactive = 20;
  // match_from_zones / match_to_zones carry the FULL scoped-global zone SET
  // (#4626 M03). A Junos global policy scope is a zone LIST
  // (`match from-zone [ trust dmz ]`); the singular match_from_zone /
  // match_to_zone (fields 11/12) keep the first element for backward
  // compatibility, while these plural fields carry every zone so an inventory
  // consumer sees the complete scope. Additive; empty for an unscoped global
  // and for ordinary zone-pair rules. A reader should prefer the plural field
  // when non-empty and fall back to the singular otherwise.
  repeated string match_from_zones = 21;
  repeated string match_to_zones = 22;
  // hit_counters_unavailable marks hit_packets/hit_bytes as NOT authoritative
  // because the rule is counter-ELIGIBLE (system-wide `policy-stats` on, or the
  // rule carries `then count`) but no runtime counter source answered for it:
  // the dataplane is unloaded, or it is loaded and the helper has published no
  // counter for THIS rule's stable rule id yet — the pre-first-status-poll
  // warm-up window, or config skew after a non-abort-class apply failure
  // (#5679) where the control plane has promoted a config the helper is not
  // yet enforcing (#7016). Before this field GetPolicies answered that window
  // with codes.Internal, discarding the WHOLE inventory for one unpublished
  // rule. The REST sibling carries the same flag as hit_counters_unavailable
  // (#5580). Additive; false (omitted) on a healthy read and for a rule that
  // is legitimately not counter-enabled — that one is signalled by count=false,
  // which is DISTINCT from counter-enabled-but-source-unavailable. A genuine
  // read FAILURE (the dataplane snapshot itself errored) is still fail-loud as
  // codes.Internal (#3408), never this flag.
  bool hit_counters_unavailable = 23;
}

message GetSessionsRequest {
  int32 limit = 1;
  int32 offset = 2;
  uint32 zone = 3;
  string protocol = 4;
  string source_prefix = 5;       // CIDR prefix filter (e.g. "10.0.1.0/24")
  string destination_prefix = 6;  // CIDR prefix filter
  uint32 source_port = 7;
  uint32 destination_port = 8;
  bool nat_only = 9;              // show only NAT sessions
  string application = 10;        // application name filter (e.g. "junos-http")
  bool include_peer = 11;         // fetch sessions from cluster peer too
  string interface_filter = 12;   // filter by ingress/egress interface name
  // Cursor-based pagination (preferred over limit/offset for large tables).
  // page_token is an opaque string returned in the previous response's
  // next_page_token.  When set, iteration resumes after that key.
  string page_token = 13;
  int32 page_size = 14;           // max entries per page; 0 = use limit/offset path
  bool no_enrich = 15;            // skip reverse-entry merge & app name resolution
  string source_nat_pool = 16;    // filter by source NAT pool name (translated source in pool)
}
message GetSessionsResponse {
  int32 total = 1;                  // exact count of filter-matching (forward-only) sessions; unfiltered uses the lightweight session count (#5034 — was -1 sentinel when filtered)
  int32 limit = 2;
  int32 offset = 3;
  repeated SessionEntry sessions = 4;
  int32 node_id = 5;              // cluster node ID (0, 1, ...)
  GetSessionsResponse peer = 6;   // peer node sessions (nil if standalone)
  string next_page_token = 7;     // opaque cursor for next page; empty = no more data
  // #8308: the peer-fetch outcome for THIS response, matching the fields
  // GetSessionSummaryResponse and GetZonePairSummaryResponse have carried
  // since #5320. Their absence here is why the session-LIST surface reported
  // no peer outcome at all: the handler's discarded error was downstream of a
  // gap in the message, not the cause of it.
  //
  // New field numbers, so a response from an older server simply omits them
  // and they decode as UNSPECIFIED / "" -- which is exactly what
  // UNSPECIFIED already means ("not evaluated / older server"). A reader must
  // therefore treat UNSPECIFIED as "this server does not report it", never as
  // an outcome.
  PeerFetchStatus peer_status = 8;
  string peer_error = 9;
}
message SessionEntry {
  string src_addr = 1;
  string dst_addr = 2;
  uint32 src_port = 3;
  uint32 dst_port = 4;
  string protocol = 5;
  string state = 6;
  uint32 policy_id = 7;
  uint32 ingress_zone = 8;
  uint32 egress_zone = 9;
  uint64 fwd_packets = 10;
  uint64 fwd_bytes = 11;
  uint64 rev_packets = 12;
  uint64 rev_bytes = 13;
  string nat = 14;
  int64 age_seconds = 15;
  uint32 timeout_seconds = 16;
  string ingress_zone_name = 17;
  string egress_zone_name = 18;
  int64 idle_seconds = 19;
  string application = 20;        // resolved application name
  string policy_name = 21;        // resolved policy name
  // Node-local dataplane session id: a display/correlation value, NOT a key,
  // and NOT the same on both cluster nodes (#6198).
  uint64 session_id = 22;
  string ingress_interface = 23;  // Junos-style interface name for ingress zone
  string egress_interface = 24;   // Junos-style interface name for egress zone
  string nat_src_addr = 25;       // SNAT translated source address
  uint32 nat_src_port = 26;       // SNAT translated source port
  string nat_dst_addr = 27;       // DNAT translated destination address
  uint32 nat_dst_port = 28;       // DNAT translated destination port
  bool ha_active = 29;            // true if session is on HA primary node
}

message GetSessionSummaryRequest {
  bool include_peer = 1;
}
message GetSessionSummaryResponse {
  int32 total_entries = 1;
  int32 forward_only = 2;
  int32 established = 3;
  int32 ipv4_sessions = 4;
  int32 ipv6_sessions = 5;
  int32 snat_sessions = 6;
  int32 dnat_sessions = 7;
  int32 node_id = 8;
  GetSessionSummaryResponse peer = 9;
  // peer_status classifies the include_peer fan-out completeness (#5320): OK
  // when the peer summary is present under `peer`, UNREACHABLE when the peer
  // was requested but its fetch failed (the totals here are LOCAL-ONLY and
  // understate cluster-wide state), NOT_APPLICABLE for a standalone node or an
  // unset include_peer. Before #5320 a peer-fetch failure was logged and
  // swallowed, leaving peer=nil — indistinguishable from a healthy standalone.
  PeerFetchStatus peer_status = 10;
  // peer_error carries the human-readable peer-fetch failure detail; empty
  // unless peer_status == UNREACHABLE (#5320).
  string peer_error = 11;
  // max_sessions is the dataplane's dynamic session-table capacity: the live
  // AF_XDP helper publishes worker_count x per-worker capacity. 0 = unknown
  // (no userspace status attached), so a consumer must render "unknown" rather
  // than a fabricated authoritative bound (#5323, replaces the hardcoded
  // 10000000 the CLI used to print).
  uint64 max_sessions = 12;
}

