// --- Policy match ---

message MatchPoliciesRequest {
  string from_zone = 1;
  string to_zone = 2;
  string source_ip = 3;
  string destination_ip = 4;
  int32 destination_port = 5;
  string protocol = 6;
  // source_port lets the simulator honor source-port-constrained application
  // terms (#3042). 0 = unspecified (does not constrain the match).
  int32 source_port = 7;
  // icmp_type / icmp_code let the simulator honor ICMP/ICMPv6 type-constrained
  // application terms (#3284, junos-ping = type 8). proto3 `optional` so the
  // simulator can distinguish "unspecified" (a type-constrained app term then
  // fails closed, mirroring the dataplane's packet_icmp = None) from a valid
  // type/code 0 (ICMP type 0 = echo-reply).
  optional uint32 icmp_type = 8;
  optional uint32 icmp_code = 9;
  // non_first_fragment marks the query as a NON-FIRST IP fragment (#5572) — the
  // flowless / no-L4 packet shape the dataplane calls l4_present == false. The
  // simulator then reproduces the #4569 fragment-associated deny (a port-bearing
  // deny the first fragment would hit denies the fragment too) instead of a
  // fabricated port-0 permit. false (default) = a normal L4-present packet, so
  // an existing client is unchanged.
  bool non_first_fragment = 10;
  // ingress_interface scopes a `to-zone junos-host` host-inbound query to ONE
  // ingress interface's effective host-inbound view (#5579). A zone can carry
  // multiple per-interface host-inbound views (#3362); without this selector the
  // classifier reports "ambiguous" when they disagree. With it, only this
  // interface's effective view (its per-interface override where declared,
  // which REPLACES the zone-level set — #6515 — else the zone-level set) is
  // classified, so an operator can certify one interface's TRUE host-inbound
  // posture (admit vs deny) instead of a zone-wide first-admit fold. The ref must
  // name an interface assigned to from_zone; an unknown / zone-mismatched /
  // lifeline ref is InvalidArgument. "" (default) = zone-scoped, so an existing
  // client is unchanged. It affects ONLY the host_inbound annotation, never the
  // policy match verdict.
  string ingress_interface = 11;
}
message MatchPoliciesResponse {
  string policy_name = 1;
  string action = 2;
  repeated string src_addresses = 3;
  repeated string dst_addresses = 4;
  repeated string applications = 5;
  bool matched = 6;
  // host_inbound_unmatched is true ONLY for a `to-zone junos-host` query that
  // matched no host-bound policy (#3285). The dataplane host gate returns None
  // here — no security policy governs the flow (no implicit host default-deny
  // at the policy layer and NO transit global/default fallback). Local delivery
  // is instead gated by host-inbound-traffic service admission, which post-#3405
  // DEFAULT-DENIES a zone with no host-inbound-traffic stanza, so "unmatched"
  // does NOT mean the packet is delivered (#3627). When set, `matched` is false
  // and `default_used` is false (the host path has no default-policy fallback).
  // Since #3375 the server populates `action` with the explanatory string
  // "host-inbound (local delivery subject to host-inbound-traffic service
  // admission — a zone with no host-inbound-traffic stanza denies by default;
  // transit/global/default policy NOT applied)" (the SSOT shared with the REST
  // surface), so `action` is NON-empty and a client may render it directly; it
  // is NOT a default-policy verdict.
  bool host_inbound_unmatched = 7;
  // global is true when the matched policy is a `policy global` rule rather
  // than a zone-pair rule (#3331); it distinguishes a global-scope verdict from
  // a same-named zone-pair policy.
  bool global = 8;
  // from_zone/to_zone are the SCOPE of the matched policy (#3331): for a
  // zone-pair policy the surrounding from-zone/to-zone stanza; for a global
  // policy its optional `match from-zone`/`match to-zone` scope (empty when the
  // global policy applies to all zones). They disambiguate a verdict when the
  // same policy name repeats across zone pairs (legal in Junos). Set only when
  // matched is true.
  string from_zone = 9;
  string to_zone = 10;
  // policy_id is the stable runtime/RT_FLOW/session-table policy ID of the
  // matched policy (#3331), so a match-policies answer can be cross-referenced
  // against the session table and the policy-deny/permit audit log even when
  // policy names collide across scopes. Set only when matched is true.
  //
  // #3623: proto3 EXPLICIT PRESENCE. The first zone-pair set's first rule has
  // runtime id 0, which a bare proto3 scalar omits on the wire — making a
  // matched-first-policy answer indistinguishable from an unmatched one (both
  // absent/0). `optional` sets the field only on a match, so its presence means
  // "matched with this id" (present even at 0) and its absence means "no id".
  optional uint32 policy_id = 11;
  // default_used is true when no policy matched and `action` is the configured
  // default-policy verdict (#3375), including the no-active-config fail-closed
  // case (deny). It is the typed form of the " (default)" suffix on `action`,
  // so a client can branch on the posture without string-parsing. False for a
  // concrete policy match and for host_inbound_unmatched (which has no
  // default-policy fallback).
  bool default_used = 12;
  // queried_from_zone / queried_to_zone echo the zone pair the caller ASKED
  // about (#3627 M06). Unlike from_zone/to_zone (which carry the SCOPE of the
  // MATCHED policy and are set only on a positive match), these are populated on
  // EVERY response — positive match, no-match/default, and host-inbound — so a
  // stored diagnostic for a default-deny or host-inbound verdict proves which
  // zone pair was tested without a separate copy of the request. They are the
  // query context, not a policy attribute; for a wildcard-zone or global match
  // they can differ from from_zone/to_zone (the matched policy's declared
  // scope).
  string queried_from_zone = 13;
  string queried_to_zone = 14;
  // #3668: match-inversion flags for the MATCHED policy, mirroring the
  // inventory PolicyRule fields 13/14. source_address_excluded /
  // destination_address_excluded are true when the matched rule carries
  // Junos `source-address-excluded` / `destination-address-excluded`: the
  // rule matches every address EXCEPT those in src_addresses/dst_addresses.
  // Without them a positive match-policies verdict reads BACKWARDS — it prints
  // the excluded address list as if the match happened BECAUSE of it, when the
  // real reason is the opposite (the shared simulator matchAddr already inverts
  // correctly; only the response omitted the flag). Additive; false (omitted)
  // for a rule without the modifier and for the unmatched / host-inbound /
  // default cases (which carry no matched policy). Set only when matched is
  // true.
  bool source_address_excluded = 15;
  bool destination_address_excluded = 16;
  // #3668: rule_id is the stable "<from>-><to>/<name>" rule identity the
  // inventory PolicyRule (field 18) and the snapshot/event path carry, computed
  // by the shared dpuserspace.StablePolicyRuleID. policy_id (field 11) is the
  // runtime/reorder-fragile numeric id; rule_id lets an operator join a
  // simulator hit to the stable identifier used by inventory, logs, and tests
  // even after a policy reorder. For a matched GLOBAL policy the identity uses
  // "junos-global->junos-global/<name>" exactly like the inventory global rows.
  // Additive; empty (omitted) for the unmatched / host-inbound / default cases.
  // Set only when matched is true.
  string rule_id = 17;
  // #3685 M05: description is the matched policy's `description` text, the same
  // field the inventory (GetPolicies) and the local `show security
  // match-policies` result carry. Descriptions often hold ticket / change-
  // control context, so a match verdict without it is weaker than the CLI and
  // inventory answers over the SAME policymatch.Result. Additive; empty
  // (omitted) for a policy with no description and for the unmatched /
  // host-inbound / default cases. Set only when matched is true.
  string description = 18;
  // #3685 M06: scheduler_name / scheduler_active expose the matched policy's
  // time-gate. scheduler_name is the `scheduler-name` binding (mirroring the
  // inventory PolicyRule field, #3624); scheduler_active is the explicit
  // effective-active flag — true when the matched policy is scheduler-gated AND
  // currently active. A positive match is by construction currently active (the
  // live simulator threads a fail-closed PolicyInactiveFn that skips a
  // scheduler-inactive rule before it can match, #3104/#3414), so a matched
  // scheduled policy always reports scheduler_active=true; it names the gate
  // that is admitting the rule right now. Additive; both empty/false (omitted)
  // for a non-scheduled (always-on) policy and for the unmatched / host-inbound
  // / default cases. Set only when matched is true.
  string scheduler_name = 19;
  bool scheduler_active = 20;
  // #3627 B1a: host_inbound is the structured host-inbound-traffic admission
  // for a `to-zone junos-host` query — WHICH system-service / protocol token
  // admits this host-bound tuple (or that the box denies / globally accepts /
  // cannot classify it). It mirrors the local CLI `show security
  // match-policies` host-inbound line the merged #4352 added, reading the SAME
  // structured token->tuple SSOT the kernel-nft builder renders from
  // (config.HostInboundServiceMatch / HostInboundProtocolMatch), so a reported
  // token can never claim a port the box does not open, and the REST + gRPC +
  // CLI surfaces cannot drift (#3375). Set ONLY for a host-bound query (present
  // on both the host_inbound_unmatched verdict and a matched to-zone junos-host
  // policy — the host-inbound gate is a separate admission stage); OMITTED
  // (nil) for every transit / global / default / content-rejected verdict,
  // which has no host-inbound gate. It is additional context, never a verdict:
  // it does not change `matched` / `host_inbound_unmatched`.
  HostInboundAdmission host_inbound = 21;
  // #4373 (E4/H2/H7): route_drop_before_policy is true when the query
  // DESTINATION is a class the transit forwarding path drops at ROUTE LOOKUP
  // before the policy engine runs — multicast, the IPv4 limited broadcast
  // 255.255.255.255, the unspecified address, or loopback. For such a
  // destination the permit/deny `action` does NOT describe real forwarding: the
  // packet is dropped at route regardless of the matching policy (and a
  // firewall `then accept; then log` for the same tuple logs an accept the flow
  // never survives — the E4 confusion). route_drop_class names the class and
  // route_drop_note carries the SSOT operator advisory string
  // (policymatch.RouteDropNote) so gRPC / remote-CLI clients state the caveat
  // identically to the local CLI + REST surfaces. ADVISORY, like host_inbound —
  // it does not change `matched` / `action` / `default_used`. Populated on the
  // transit verdict paths (matched + no-match/default); omitted for an ordinary
  // unicast destination and for a host-bound query (which takes the
  // local-delivery gate, not transit route lookup).
  bool route_drop_before_policy = 22;
  string route_drop_class = 23;
  string route_drop_note = 24;
  // #5572: fragment_associated_deny is true when the query was a non-first IP
  // fragment (non_first_fragment in the request) whose PERMIT was OVERRIDDEN to
  // an overlapping port-bearing DENY, reproducing the dataplane's #4569
  // fragment-associated deny. When set, `matched` is true and the response is
  // attributed to the ENFORCING deny (policy_name / policy_id / rule_id /
  // action). fragment_deny_note carries the SSOT operator advisory string
  // (policymatch.FragmentDenyNote) so gRPC / remote-CLI clients explain the
  // over-drop identically to the local CLI + REST surfaces. ADVISORY, like
  // route_drop_note — it does not change the verdict beyond the deny override.
  // Omitted (false / empty) for every non-fragment verdict and for a fragment
  // that a real deny matched directly or that permits with no overlapping deny.
  bool fragment_associated_deny = 25;
  string fragment_deny_note = 26;
}

// HostInboundAdmissionStatus classifies how the ingress zone's
// host-inbound-traffic admission gate treats a host-bound query tuple (#3627
// B1a). It mirrors dataplane/userspace.HostInboundStatus. Presence-safe so the
// states are distinguishable — a bare token string could not tell "denied"
// from "not computed" from "admitted by a global accept". The numeric values
// match the Go iota order exactly.
enum HostInboundAdmissionStatus {
  // Zero value: admission was not computed (not a host-bound query, or no
  // config). Rendered as absence — the enclosing host_inbound message is
  // omitted in this state.
  HOST_INBOUND_ADMISSION_STATUS_NOT_COMPUTED = 0;
  // The query omits the protocol, or omits the destination-port / icmp-type a
  // port/ICMP token needs, so the admitting token cannot be identified. Never
  // reported as a false admit.
  HOST_INBOUND_ADMISSION_STATUS_INDETERMINATE = 1;
  // Admitted by a GLOBAL pre-accept independent of the zone's
  // host-inbound-traffic set (ICMP error/PMTUD, IPv6 ND, or the raw ESP/AH data
  // plane), matching the top-of-chain nft accepts (#3171).
  HOST_INBOUND_ADMISSION_STATUS_GLOBAL_ACCEPT = 2;
  // Admitted by a named host-inbound-traffic token (token/kind identify it).
  HOST_INBOUND_ADMISSION_STATUS_TOKEN_ADMIT = 3;
  // The ingress zone's host-inbound-traffic admits nothing matching this tuple
  // — the box drops the packet (Junos default-deny).
  HOST_INBOUND_ADMISSION_STATUS_DENIED = 4;
  // The ingress zone carries MULTIPLE distinct per-interface host-inbound
  // effective views (#3362) that classify this tuple DIFFERENTLY — one interface
  // admits it, another denies it (#5579). A zone-scoped query cannot answer for
  // the whole zone without lying for the sibling interfaces; the differing
  // interface groups are named in `description`. Supply ingress_interface to get
  // one interface's true admission.
  HOST_INBOUND_ADMISSION_STATUS_AMBIGUOUS = 5;
}

// HostInboundAdmission is the structured host-inbound-traffic classifier verdict
// for a host-bound match-policies query (#3627 B1a), mirroring
// dataplane/userspace.HostInboundAdmission. token/kind are meaningful only when
// status == HOST_INBOUND_ADMISSION_STATUS_TOKEN_ADMIT.
message HostInboundAdmission {
  HostInboundAdmissionStatus status = 1;
  // token is the admitting host-inbound-traffic token (e.g. "ssh", "bgp",
  // "all"); set only for TOKEN_ADMIT.
  string token = 2;
  // kind is the stanza the token belongs to: "system-services" or "protocols".
  // Set only for TOKEN_ADMIT.
  string kind = 3;
  // description is the human-readable one-line explanation the local CLI prints
  // for this admission (dataplane/userspace.HostInboundAdmission.Describe()),
  // carried so a REST/gRPC client renders the SAME sentence the CLI shows
  // without re-deriving it. Empty only for NOT_COMPUTED (which omits the whole
  // message).
  string description = 4;
}

// --- NAT rule counters ---

message GetNATRuleStatsRequest {
  string rule_set = 1;  // rule-set name (empty = all)
  string nat_type = 2;  // "source", "destination", or "" (source only for backward compat)
}
message GetNATRuleStatsResponse {
  repeated NATRuleStats rules = 1;
}
message NATRuleStats {
  string rule_set = 1;
  string rule_name = 2;
  string from_zone = 3;
  string to_zone = 4;
  string action = 5;
  string source_match = 6;
  string destination_match = 7;
  uint64 hit_packets = 8;
  uint64 hit_bytes = 9;
  // #7473: the snapshot builder's fail-closed verdict for this object.
  //
  // `not_installed` true means the userspace builder REFUSED to install it, so
  // every other field here describes CONFIGURATION rather than live state --
  // notably any hit counter, whose zero means "not armed" rather than "no
  // traffic matched". `not_installed_reason` carries the operator-facing
  // remedy from the same `pkg/config` predicate the CLI text renderers use, so
  // the structured and text surfaces cannot disagree about which objects are
  // armed.
  //
  // Additive: an older client that does not read these decodes them as
  // false/"" and behaves exactly as before.
  bool not_installed = 10;
  string not_installed_reason = 11;
}

// --- Deterministic source-NAT (CGNAT / NAPT64) mapping lookup ---
//
// Forward (subscriber -> translated) and reverse (translated -> subscriber)
// deterministic mapping resolution against the LAST-APPLIED NAT generation
// (#5794). direction selects the query; pool is optional (an ambiguous
// tuple across multiple deterministic pools is rejected, never first-match).

enum NATDeterministicDirection {
  NAT_DETERMINISTIC_DIRECTION_UNSPECIFIED = 0;
  // FORWARD: internal_host -> external IPv4 + assigned port block.
  NAT_DETERMINISTIC_DIRECTION_FORWARD = 1;
  // REVERSE: (nat_ip, nat_port) -> internal subscriber.
  NAT_DETERMINISTIC_DIRECTION_REVERSE = 2;
}

message GetNATDeterministicRequest {
  NATDeterministicDirection direction = 1;
  string pool = 2;           // optional source NAT pool filter
  string internal_host = 3;  // FORWARD: subscriber IP (IPv4 mode 1 / IPv6 mode 2)
  string nat_ip = 4;         // REVERSE: translated external IPv4
  uint32 nat_port = 5;       // REVERSE: translated port (1-65535)
}

message GetNATDeterministicResponse {
  bool found = 1;
  // error_code is a stable machine-readable token when found=false
  // (no-applied-view, unknown-pool, not-deterministic, malformed-input,
  // out-of-range, ambiguous-pool, not-found). Empty when found=true.
  string error_code = 2;
  string error_detail = 3;

  uint64 applied_generation = 4;
  string pool = 5;
  uint32 mode = 6;            // 1 = IPv4 source NAT, 2 = IPv6 NAPT64
  string internal_host = 7;   // subscriber (input for forward, recovered for reverse)
  string external_ip = 8;     // translated external IPv4
  uint32 nat_port = 9;        // reverse: echoed translated port (0 for forward)
  uint32 port_low = 10;       // inclusive port-block low
  uint32 port_high = 11;      // inclusive port-block high
  uint32 block_size = 12;
  uint32 block_index = 13;
  // #9070: on a REVERSE lookup in IPv6 mode, `internal_host` is the
  // deterministic UNIT's network BASE, not an exact host, and a bare address
  // reads as an exact /128. This is that unit's prefix length (64 or 96); 0 for
  // a forward lookup or IPv4 mode. It is NOT the configured pool prefix -- the
  // unit is the configured prefix PLUS the reconstructed 32-bit subscriber
  // word, so the two are never equal.
  uint32 internal_prefix_len = 14;
}

// --- Completion messages ---

message CompleteRequest {
  string line = 1;
  // pos is a BYTE offset into line (not a rune/codepoint index): the server's
  // Complete slices line[:pos]. Callers with a rune-indexed cursor (readline)
  // MUST convert to the byte length of the prefix before sending, or a
  // multibyte rune before the cursor makes pos < len(bytes) and the slice cuts
  // a code point in half. The server rejects a pos that lands mid-rune with
  // InvalidArgument (#4970).
  int32 pos = 2;
  bool config_mode = 3;
}
message CompleteResponse {
  repeated string candidates = 1;
  repeated string descriptions = 2;  // parallel to candidates: desc[i] for candidates[i]
}

// --- Generic text show ---

message ShowTextRequest {
  string topic = 1;  // "schedulers", "snmp", "dhcp-relay", "firewall", "alg",
                      // "dynamic-address", "address-book", "applications",
                      // "flow-timeouts", "flow-monitoring", "nat-static"
  string filter = 2; // optional filter string (topic-specific, e.g. zone pair)
}
message ShowTextResponse { string output = 1; }

// --- System info ---

message GetSystemInfoRequest {
  string type = 1;  // "uptime", "memory"
}
message GetSystemInfoResponse { string output = 1; }

// --- System action ---

message SystemActionRequest {
  string action = 1;  // "reboot", "halt", "zeroize", "dhcp-renew"
  string target = 2;  // optional target (e.g. interface name for dhcp-renew)
}
message SystemActionResponse { string message = 1; }

// --- Monitor security packet-drop ---

message MonitorPacketDropRequest {
  string source_prefix = 1;
  string destination_prefix = 2;
  uint32 source_port = 3;
  uint32 destination_port = 4;
  string protocol = 5;
  string from_zone = 6;
  string interface = 7;
  int32  count = 8;   // 0 = unlimited
  string node = 9;    // cluster node filter
}
message MonitorPacketDropResponse { string line = 1; }

message MonitorInterfaceRequest {
  string interface_name = 1;  // empty = traffic summary mode
  MonitorInterfaceSummaryMode summary_mode = 2;
}
message MonitorInterfaceResponse {
  string frame = 1;  // pre-formatted text frame
}

// GetZonePairSummary aggregates the local session table by (from-zone,
// to-zone) pair, broken down by protocol class. include_peer fans out to
// the cluster peer (mirrors GetSessionSummary): the peer leg returns its
// OWN zone-pair breakdown under `peer`. The peer request is gated by the
// x-peer-forwarded recursion guard so A->B never recurses back into A.
// These messages are appended at the end of the file deliberately: inserting
// them mid-file would renumber every later message's generated msgTypes index
// and bloat the generated diff with pure churn.
message GetZonePairSummaryRequest {
  bool include_peer = 1;  // fetch the cluster peer's zone-pair breakdown too
}
message ZonePairSessionSummary {
  string from_zone = 1;
  string to_zone = 2;
  int64 tcp = 3;
  int64 udp = 4;
  int64 icmp = 5;
  int64 other = 6;
  int64 total = 7;
}
message GetZonePairSummaryResponse {
  repeated ZonePairSessionSummary zone_pairs = 1;
  int32 node_id = 2;                      // cluster node ID (0, 1, ...)
  GetZonePairSummaryResponse peer = 3;    // peer node breakdown (nil if standalone)
  // peer_status / peer_error mirror GetSessionSummaryResponse (#5320): a peer
  // fetch failure is now VISIBLE (UNREACHABLE) instead of leaving peer=nil and
  // looking like a healthy standalone breakdown.
  PeerFetchStatus peer_status = 4;
  string peer_error = 5;
}

// PeerFetchStatus classifies whether a summary response's cluster-peer leg was
// successfully included, so a machine consumer can distinguish a genuine
// standalone / no-peer-requested view (NOT_APPLICABLE) from a cluster peer that
// was requested but could NOT be reached (UNREACHABLE). Before #5320 a peer
// fetch failure was logged and swallowed: the response returned the LOCAL-ONLY
// totals with peer=nil, indistinguishable from a healthy standalone node — a
// peer partition then looked like a healthy low session count. UNREACHABLE
// surfaces the incompleteness while still returning the (useful) local totals.
enum PeerFetchStatus {
  PEER_FETCH_STATUS_UNSPECIFIED = 0;    // not evaluated / older server
  PEER_FETCH_STATUS_NOT_APPLICABLE = 1; // standalone, or include_peer not set
  PEER_FETCH_STATUS_OK = 2;             // peer requested and its data is included
  PEER_FETCH_STATUS_UNREACHABLE = 3;    // peer requested but the fetch failed; peer data omitted
  // #8308: the peer IS reachable and THIS node declined to ask -- the fetch was
  // refused on admission (peer_only_5968.go returns codes.ResourceExhausted).
  // Before this, an admission refusal was classified UNREACHABLE, which sends
  // an operator debugging a fabric problem after a network fault that does not
  // exist. ADDED, never a redefinition of UNREACHABLE: in a rolling HA upgrade
  // the two nodes run different binaries against one wire, so narrowing an
  // existing member's meaning would silently change what the OLDER binary
  // reports. An older decoder renders this as the raw integer 4, which is
  // wrong-looking rather than wrong -- and that is the trade the additive
  // choice buys.
  PEER_FETCH_STATUS_BUSY = 4;
}
// ZoneQuarantineState reports whether the server quarantined a zone because its
// StableZoneID collides with an earlier-sorting zone's id (#10531).
//
// UNKNOWN IS 0 ON PURPOSE, and it is the whole point of this being an enum
// rather than a bool — the same skew argument as ZoneCounterAvailability
// (#6895). proto3 has no field presence for scalars: a `bool quarantined` sent
// by an OLD server decodes to `false` on a new client, which is
// indistinguishable from the server saying "not quarantined" — so every
// quarantined zone from an old server would render as clean. The inverted
// spelling has the mirror-image defect: absent decodes to "quarantined" and
// every ordinary zone renders as dropped from the dataplane.
//
// With UNKNOWN = 0 the skewed pair is honest by construction: a new client
// talking to an old server sees UNKNOWN and renders exactly as it did before
// #10531, introducing no new wrong answer in either direction. Clients MUST
// fall back to their pre-#10531 rendering on UNKNOWN and MUST never render it
// as clean.
enum ZoneQuarantineState {
  // The server did not say. An old server omits the field entirely and it
  // decodes here. Clients MUST fall back to their pre-#10531 rendering.
  ZONE_QUARANTINE_STATE_UNKNOWN = 0;
  // The zone is not excluded by StableZoneID collision quarantine (ordinary
  // zone or collision survivor). This verdict does not assert that the
  // dataplane is loaded or has applied the zone. quarantine_survivor_zone is
  // empty.
  ZONE_QUARANTINE_STATE_NOT_QUARANTINED = 1;
  // The zone's StableZoneID collides with an earlier-sorting zone's id, so
  // the zone was dropped from the dataplane (its interfaces unzoned, its
  // traffic denied). quarantine_survivor_zone names the surviving zone that
  // owns the shared numeric id. The four counter fields are meaningless zeros
  // and per_zone_counter_availability is UNAVAILABLE: the server never
  // publishes the survivor's volume under the loser.
  ZONE_QUARANTINE_STATE_QUARANTINED = 2;
}
