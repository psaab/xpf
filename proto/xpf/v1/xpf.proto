message GetEventsResponse {
  repeated EventEntry events = 1;
}
message EventEntry {
  string time = 1;
  string type = 2;
  string src_addr = 3;
  string dst_addr = 4;
  string protocol = 5;
  string action = 6;
  uint32 policy_id = 7;
  uint32 ingress_zone = 8;
  uint32 egress_zone = 9;
  string screen_check = 10;
  uint64 session_packets = 11;
  uint64 session_bytes = 12;
  string ingress_zone_name = 13;
  string egress_zone_name = 14;
  string policy_name = 15;
  uint64 rev_session_pkts = 16;
  uint64 rev_session_bytes = 17;
  string app_name = 18;
  string ingress_iface = 19;
  string close_reason = 20;
  // #3337 additive forensic fields. These carry the remaining RT_FLOW
  // record values the CLI prints (cli_show_security_log.go) so a SIEM
  // consuming GetEvents can reproduce the full close record. All are
  // additive (new field numbers, no renumber). 0 / "" means the event
  // did not carry the field (e.g. a non-close event, or no NAT applied).
  string nat_src_addr = 21;     // post-NAT source "ip:port" ("" = no NAT)
  string nat_dst_addr = 22;     // post-NAT destination "ip:port"
  // Dataplane session id (the #4915 [152:160] ringbuf slot).
  //
  // CROSS-NODE STABLE (#5212): a peer-synced session ADOPTS the originating
  // node's id, so this node's SESSION_CLOSE carries the same id as the
  // originating node's SESSION_CREATE. That is the whole point of #5212 and it
  // is what a SIEM correlates on across a failover.
  //
  // #6666 corrected this comment, which was backwards on BOTH halves: it said
  // the id was node-local and NOT the same on both nodes (it is the same, since
  // #5212), and it pointed at `show security flow session` on THIS node as the
  // correlation target (which rendered a DIFFERENT, control-plane-minted id for
  // a peer-synced session until #6666 made the mirror adopt this one). Both
  // surfaces now render this id, so either correlation works.
  uint64 session_id = 23;
  uint32 elapsed_time = 24;     // seconds since session creation (CLOSE)
  uint32 created = 25;          // absolute session-creation Unix seconds (CLOSE)
  uint32 created_nanos = 26;    // sub-second nanosecond remainder of created
  uint32 egress_ifindex = 27;   // SNMP ifIndex of the resolved output interface
  uint32 ingress_ifindex = 28;  // SNMP ifIndex of the ingress interface
  uint32 tos = 29;              // IP ToS byte observed on the forward direction
  uint32 tcp_control_bits = 30; // OR of every TCP flag byte seen over the flow
  string reason = 31;           // policy/screen reason (deny/drop events)
}

