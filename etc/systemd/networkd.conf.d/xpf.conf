# xpf (#16804): systemd-networkd must not manage foreign routing
# policy rules. Its default ManageForeignRoutingPolicyRules=yes deletes
# every rule it did not install — all of xpf's ip-rule bands (the VRF
# miss terminator, the mgmt-DNS 2500-2503 lookup/shadow pairs, the
# next-table / rib-group leak band and the PBR/FBF mirror) — on every
# `networkctl reconfigure` xpf itself runs and on every networkd
# restart. xpf owns those bands end to end (pkg/routing/README.md), so
# networkd's foreign-rule cleanup must stay off.
#
# Installed by the image bake and staged by the .deb under
# /usr/lib/systemd/networkd.conf.d; an operator override belongs in
# /etc/systemd/networkd.conf.d with a lexically later name.
[Network]
ManageForeignRoutingPolicyRules=no
