# xpf userspace dataplane: hugepage reservation for UMEM.
#
# DEFAULT POOL: sized for the DEFAULT configuration only.
#
# At the default `ring-entries 1024` (pkg/dataplane/userspace
# capabilities.go) a binding's UMEM is 2560 frames x 4 KiB = 10 MiB
# (mlx5 / generic driver: reserved TX = min(ring/2, 8192) = 512, plus
# 2 x ring = 2048) or 3072 frames = 12 MiB on virtio_net (reserved TX =
# ring = 1024). MAP_HUGETLB rounds each UMEM up to whole 2 MiB pages
# (userspace-dp/src/afxdp/umem/mmap.rs), so one binding consumes 5
# hugepages (6 on virtio_net). `binding_frame_count_for_driver` in
# userspace-dp/src/afxdp/bind.rs is authoritative and
# `umem_sizing_contract_tests` (same file) pins these figures.
#
# The shipped value below (90 = 5 x 18) therefore covers the reference
# topology -- 3 binding candidates x 6 RX queues = 18 bindings -- at
# the default ring size, and nothing more: 90 x 2 MiB = 180 MiB. It
# replaces the previous 1440 (2.8 GiB), which reserved the
# ring-entries 16384 pool on every box including 2 GiB validation VMs
# and 4 GiB appliances running the default config (#16455). Do NOT
# raise this shipped default back to a large-ring value: hugepages are
# withheld from ordinary allocation for the life of the boot, and this
# file is applied by systemd-sysctl at boot on baked images.
#
# LARGE RINGS (ring-entries >= 16384): SIZE THE POOL FROM THE TOTAL
# BINDING COUNT, NOT FROM ONE NIC.
#
#   pages = 80 x SUM over every binding candidate of min(rx_queues, 16)
#
# At ring 16384 UMEM per binding is 160 MiB = 80 x 2 MiB hugepages, for
# EVERY driver: reserved TX is min(ring/2, MAX_RESERVED_TX_FRAMES=8192)
# for mlx5 and is clamped to that same 8192 for virtio_net, so both
# come to 8192 + 2*16384 = 40960 frames x 4 KiB. (Below the clamp they
# differ: at ring=8192 mlx5 is 80 MiB and virtio_net is 96 MiB.) The
# reference 18-binding topology then needs 80 x 18 = 1440 pages
# (2.8 GiB), measured on loss:xpf-userspace-fw1 as
# `Private_Hugetlb: 2949120 kB` in /proc/<pid>/smaps_rollup. Since
# #7497 the planner mints each interface's OWN queue count rather than
# one global minimum, so the binding count is that SUM. Binding
# candidates are the zoned, non-tunnel, non-local-fabric netdevs --
# which INCLUDES the fabric IPVLAN parent, the interface most often
# left out of a hand count.
#
# To provision a large-ring box, either:
#   - bake a rig image with `bake.py --hugepages 1440` (or the sized
#     value for your topology), which writes that value instead of
#     this file's default; or
#   - edit /etc/sysctl.d/99-xpf-hugepages.conf on the box, then
#     `sysctl --system` (or reboot) and restart xpfd.
#
# Both directions cost something:
#   - Under-reserved: MAP_HUGETLB fails and the daemon falls back to
#     4 KiB pages + MADV_HUGEPAGE, which is ADVISORY. Throughput then
#     stalls in TLB-miss latency (measured 22.1 -> 20.4 Gbps at ring
#     16384). The helper logs `xpf-ha: WARNING: the 2 MB hugepage pool
#     could not back this UMEM` with the per-binding page count, so
#     this failure is loud rather than silent -- but it is still a
#     failure. At the default ring-entries 1024 the fallback is only a
#     performance hint; correctness never depends on this pool.
#   - Over-reserved: hugepages are withheld from ordinary allocation
#     for the life of the boot. Do not reserve 2.8 GiB on a 4 GiB
#     appliance.
#
# NOTE: this memory is NOT visible in RSS. It is hugetlb-backed, so
# `/proc/<pid>/status` VmRSS understates the dataplane's footprint by
# more than an order of magnitude at large rings (measured 130 MiB RSS
# against 2.81 GiB of UMEM). Read `Private_Hugetlb` in
# /proc/<pid>/smaps_rollup, or HugePages_Free in /proc/meminfo. It is
# also not mlocked (`Locked: 0 kB`), so RLIMIT_MEMLOCK does not bound
# it.
#
# Rationale and measurement: docs/userspace-dataplane-architecture.md
# "Hugepages (REQUIRED for ring >= 16384)" section.
#
# Installed by: the appliance bake ONLY (scripts/image/bake.py,
# verbatim, to /etc/sysctl.d/). The .deb deliberately does NOT install
# this file (#16455, #10733): /usr/lib/sysctl.d is applied by systemd's
# file trigger at package-install time, so shipping it in the .deb
# reserved 2.8 GiB on a foreign, never-committed host the moment apt
# finished. A foreign-host / manual install that wants a pool copies
# this repo file (or a resized copy) to /etc/sysctl.d/ by hand. To
# resize on a baked image, edit /etc/sysctl.d/99-xpf-hugepages.conf;
# package upgrades never touch that path.
#
# Apply with `sysctl --system` (or reboot). Verify with
# `grep HugePages_ /proc/meminfo`.
vm.nr_hugepages = 90
