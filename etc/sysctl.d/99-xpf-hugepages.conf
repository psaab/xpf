# xpf userspace dataplane: hugepage reservation for UMEM.
#
# Required when ring-entries >= 16384. At that size UMEM per binding is
# 160 MiB = 80 x 2 MiB hugepages, for EVERY driver: reserved TX is
# min(ring/2, MAX_RESERVED_TX_FRAMES=8192) for mlx5 and is clamped to that
# same 8192 for virtio_net, so both come to 8192 + 2*16384 = 40960 frames
# x 4 KiB. (Below the clamp they differ: at ring=8192 mlx5 is 80 MiB and
# virtio_net is 96 MiB.) `binding_frame_count_for_driver` in
# userspace-dp/src/afxdp/bind.rs is authoritative and
# `umem_sizing_contract_tests` (same file) pins these figures.
#
# SIZE IT FROM THE TOTAL BINDING COUNT, NOT FROM ONE NIC.
#
#   pages = 80 x SUM over every binding candidate of min(rx_queues, 16)
#
# Since #7497 the planner mints each interface's OWN queue count rather than
# one global minimum, so the binding count is that SUM. Binding candidates are
# the zoned, non-tunnel, non-local-fabric netdevs -- which INCLUDES the fabric
# IPVLAN parent, the interface most often left out of a hand count.
#
# This value (1440 = 80 x 18) covers the reference topology these appliances
# are tested on: 3 binding candidates x 6 RX queues, measured on
# loss:xpf-userspace-fw1 as `Private_Hugetlb: 2949120 kB` (2.81 GiB) in
# /proc/<pid>/smaps_rollup. It REPLACES a previous value of 600, which was
# derived from one NIC's 6 bindings and covered only 7 of that topology's 18.
#
# Recompute it for your box. Both directions cost something:
#   - Under-reserved: MAP_HUGETLB fails and the daemon falls back to 4 KiB
#     pages + MADV_HUGEPAGE, which is ADVISORY. Throughput then stalls in
#     TLB-miss latency (measured 22.1 -> 20.4 Gbps). The helper now logs
#     `xpf-ha: WARNING: the 2 MB hugepage pool could not back this UMEM`
#     with the per-binding page count, so this failure is loud rather than
#     silent -- but it is still a failure.
#   - Over-reserved: hugepages are withheld from ordinary allocation for the
#     life of the boot. Do not reserve 2.8 GiB on a 4 GiB appliance.
#
# NOTE: this memory is NOT visible in RSS. It is hugetlb-backed, so
# `/proc/<pid>/status` VmRSS understates the dataplane's footprint by more
# than an order of magnitude (measured 130 MiB RSS against 2.81 GiB of UMEM).
# Read `Private_Hugetlb` in /proc/<pid>/smaps_rollup, or HugePages_Free in
# /proc/meminfo. It is also not mlocked (`Locked: 0 kB`), so RLIMIT_MEMLOCK
# does not bound it.
#
# Rationale and measurement: docs/userspace-dataplane-architecture.md
# "Hugepages (REQUIRED for ring >= 16384)" section.
#
# Installed by: the appliance bake (scripts/image/bake.py, verbatim, to
# /etc/sysctl.d/) and the .deb (debian/rules, to /usr/lib/sysctl.d/ --
# package-owned so unattended adoption never prompts). To resize, edit
# /etc/sysctl.d/99-xpf-hugepages.conf: /etc wins over /usr/lib by
# sysctl.d precedence and is never touched by package upgrades. Before
# #16243 no provisioning path installed this file, so ring-entries
# 16384 rigs reported `Hugepage-backed bindings: 0/N`. Operator
# procedure: docs/deploy-quickstart.md "UMEM hugepages".
#
# Apply with `sysctl --system` (or reboot). Verify with
# `grep HugePages_ /proc/meminfo`.
vm.nr_hugepages = 1440
