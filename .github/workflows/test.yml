# These checks report on every PR but do not block merges until status contexts
# are required in master branch rulesets. Do not require the Go job while
# ordinary affected-package selections are red on master.
# Owner action, once those baselines are green: require `CI tests / Go build
# and affected tests`, `CI tests / Rust workspace compile check`, and
# `CI tests / Harness census and self-test`.
#
# The full Go suite is currently red on master, so the Go test step selects the
# changed packages and their reverse dependents. Once `go test ./... -count=1`
# is green on master, replace that selector with the full-suite command.
# The Rust workspace test suite is also red on master; the manual
# packet-level gates and the results-recording contract are documented in
# `docs/ci-gate-contract.md`. Keep the all-targets compile check until
# `cargo test --workspace` is green, then promote it here.
name: CI tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  census:
    name: Harness census and self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #16477: the repo pins scratch to /var/worktrees/.cache/tmpdir
    # (Makefile ?=, #14833), which does not exist on a clean runner and
    # cannot be created there; the census self-test now creates its own
    # parent, and a runner-local TMPDIR keeps every other temp consumer
    # (python tempfile, bare mktemp) off the pinned root too.
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - name: Census runnable-harness reachability
        run: sh scripts/harness-census.sh
      - name: Self-test the census
        run: bash ./test/incus/harness-census-selftest.sh
      # #16465: rust-source reachability -- a deleted test `mod` line
      # orphans a file `cargo check --all-targets` cannot see.
      - name: Rust source census
        run: |
          python3 scripts/rust-source-census-13961.py --self-test
          python3 scripts/rust-source-census-13961.py userspace-dp/src
      # #16474: the remaining hermetic censuses. These ran only via
      # `make test` / `make selftest`, so skip/ignore drift accumulated
      # between manual runs with no merge-visible signal. Each is a
      # pure file scan (no network, no toolchain beyond python3/sh):
      # a new undeclared t.Skip or #[ignore] reds this job.
      - name: Go skip census
        run: bash scripts/go-skip-census.sh
      - name: Ignored-cell census
        run: sh scripts/ignored-cell-census.sh
      - name: Self-test the Go skip census
        run: bash ./test/incus/go-skip-census-selftest.sh
      - name: Self-test the ignored-cell census
        run: bash ./test/incus/ignored-cell-census-selftest.sh

  proto:
    name: Proto header and regen check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #16477: Makefile ?= would pin TMPDIR to the uncreatable
    # /var/worktrees/.cache/tmpdir; proto_regen_check.sh's scratch and
    # the Go toolchain need a runner-local temp root instead.
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Hermetic leg (#16195): header stamps == proto/README.md
      # constants == go.mod. No network/toolchain beyond checkout.
      - name: Hermetic proto header check
        run: make proto-check
      # CI-only regen leg (#16195): pinned protoc (release zip -- it has
      # no `go install` path) + pinned plugins regenerate the stubs;
      # any diff is a .proto edited without regeneration. The script
      # downloads protoc 3.21.12 and `go install`s the pinned plugins.
      - name: Install unzip for pinned protoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends unzip
      - name: Pinned proto regen check
        run: make proto-regen-check

  # Advisory tooling leg (#16197): pinned shellcheck + the hermetic
  # Python subset under scripts/, run directly (NOT
  # scripts/run-selftests.sh whole). Publishes one TOOLING_LEG
  # ran/skipped/failed line per leg; ran==0 or any skip deviating
  # from expected_skipped=0 is red. Advisory per
  # docs/ci-gate-contract.md -- do not require this status context
  # in branch rulesets without the recorded baseline-green period.
  tooling:
    name: Advisory tooling (shellcheck + Python subset)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # #16477: same pinned-TMPDIR trap as the census/proto jobs -- the
    # Python subset's tempfile and the scripts it drives must not
    # default to /var/worktrees/.cache/tmpdir on a clean runner.
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Advisory tooling check (pinned shellcheck, hermetic Python)
        run: make tooling-check

  go:
    name: Go build and affected tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #16477: GOTMPDIR/GOCACHE stay on the Makefile pins only where a
    # caller pre-creates them; on a clean runner the Go toolchain must
    # use runner-local temp/cache roots, not /var/worktrees/.cache.
    env:
      TMPDIR: ${{ runner.temp }}
      GOTMPDIR: ${{ runner.temp }}/go-tmp
      GOCACHE: ${{ runner.temp }}/go-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # W1.12 (#16206/#16125): install real FRR so the vtysh oracle
      # (TestRenderedRoutingConfigAcceptedByFRR11417) RUNS in CI
      # instead of silently skipping when vtysh is absent. Without
      # this step the grown golden corpus proves nothing in CI.
      - name: Install FRR for the vtysh oracle
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends frr
          command -v vtysh
      - name: Build all Go packages
        run: go build ./...
      - name: Test affected Go packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/ci_affected_go_tests.sh "$BASE_SHA" "$HEAD_SHA"

  rust:
    name: Rust workspace compile check
    runs-on: ubuntu-latest
    # Use distro libraries that meet userspace-dp's validated version floors.
    container:
      image: debian:forky
    timeout-minutes: 20
    # #16477: cargo's target dir and temp root must be runner-local on a
    # clean runner; the Makefile /var/worktrees pins cannot be created.
    env:
      TMPDIR: ${{ runner.temp }}
      CARGO_TARGET_DIR: ${{ runner.temp }}/cargo
    steps:
      # Install first: the forky image ships no git, and checkout@v4 falls
      # back to a metadata-less archive when git is missing.
      - name: Install native dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            bash \
            build-essential \
            ca-certificates \
            curl \
            git \
            libelf-dev \
            libxdp-dev \
            pkg-config \
            zlib1g-dev \
            libzstd-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace-dp
      - name: Check Rust workspace and all targets
        run: >-
          cargo check --manifest-path userspace-dp/Cargo.toml
          --workspace --all-targets
