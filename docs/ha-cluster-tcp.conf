groups {
    node0 {
        system {
            host-name xpf-tcp-fw0;
        }
        chassis {
            cluster {
                node 0;
                peer-address 10.99.14.2;
                fabric-peer-address 10.99.15.2;
            }
        }
        interfaces {
            fxp0 {
                unit 0 { family inet { dhcp; } }
            }
            em0 {
                unit 0 { family inet { address 10.99.14.1/30; } }
            }
            fab0 {
                unit 0 { family inet { address 10.99.15.1/30; } }
            }
            ge-0/0/1 {
                gigether-options { redundant-parent reth1; }
            }
            ge-0/0/2 {
                gigether-options { redundant-parent reth0; }
            }
        }
    }
    node1 {
        system {
            host-name xpf-tcp-fw1;
        }
        chassis {
            cluster {
                node 1;
                peer-address 10.99.14.1;
                fabric-peer-address 10.99.15.1;
            }
        }
        interfaces {
            fxp0 {
                unit 0 { family inet { dhcp; } }
            }
            em0 {
                unit 0 { family inet { address 10.99.14.2/30; } }
            }
            fab1 {
                unit 0 { family inet { address 10.99.15.2/30; } }
            }
            ge-7/0/1 {
                gigether-options { redundant-parent reth1; }
            }
            ge-7/0/2 {
                gigether-options { redundant-parent reth0; }
            }
        }
    }
}
apply-groups "${node}";
chassis {
    cluster {
        cluster-id 23;
        # #6611: the cluster control channel (fabric gRPC, heartbeat,
        # session sync) authenticates with this shared PSK and fails OPEN
        # without it. LAB VALUE — generate your own per cluster with
        # `openssl rand -base64 32` and keep it identical on both nodes.
        authentication-key "Vszxr1XqVetBwtLPWlm0vLadzri2JmBTjdmn2FbSKgI=";
        reth-count 2;
        heartbeat-interval 200;
        heartbeat-threshold 5;
        control-interface em0;
        configuration-synchronize;
        redundancy-group 0 {
            node 0 priority 200;
            node 1 priority 100;
        }
        redundancy-group 1 {
            node 0 priority 200;
            node 1 priority 100;
            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/2 weight 255;
                ge-7/0/2 weight 255;
            }
        }
        redundancy-group 2 {
            node 0 priority 200;
            node 1 priority 100;
            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/1 weight 255;
                ge-7/0/1 weight 255;
            }
        }
    }
}
interfaces {
    fab0 {
        fabric-options {
            member-interfaces {
                ge-0/0/0;
            }
        }
    }
    fab1 {
        fabric-options {
            member-interfaces {
                ge-7/0/0;
            }
        }
    }
    reth0 {
        redundant-ether-options { redundancy-group 1; }
        vlan-tagging;
        unit 50 {
            vlan-id 50;
            # #18558: .42, not .10. VLAN 50 is a shared lab segment with
            # non-xpf devices on it, and 172.16.50.10 is held by one of them
            # (18:e8:29:2c:13:7a answered every RFC 5227 probe for it,
            # 2026-10-31). The upstream gateway's ARP entry flipped between
            # that host and this cluster, so roughly 20-50% of IPv4 replies
            # went to the other host. Re-check with an ARP probe before
            # renumbering again; docs/incus-tcp-udp-plan.md section 3.3.
            family inet { address 172.16.50.42/24; }
            family inet6 { address 2001:559:8585:50::a/64; }
        }
        unit 80 {
            vlan-id 80;
            family inet { address 172.16.80.10/24; }
            family inet6 { address 2001:559:8585:80::a/64; }
        }
    }
    reth1 {
        redundant-ether-options { redundancy-group 2; }
        unit 0 {
            family inet { address 10.0.62.1/24; }
            family inet6 { address 2001:559:8585:aa00::1/64; }
        }
    }
}
security {
    flow { allow-dns-reply; allow-embedded-icmp; }
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic { system-services { ssh; ping; } }
        }
        security-zone control {
            interfaces { em0; fab0; fab1; }
            host-inbound-traffic { system-services { all; } }
        }
        security-zone wan {
            interfaces { reth0.50; reth0.80; }
            host-inbound-traffic {
                system-services { ping; }
                protocols { router-discovery; }
            }
        }
        security-zone lan {
            interfaces {
                # #7490: `dhcp` is admitted PER INTERFACE here, not inherited
                # from the zone. reth1 runs the dhcp-local-server below, and xpf
                # now withholds a zone-level `dhcp`/`bootp` from a DHCP
                # server/relay interface -- Junos accepts those two tokens only
                # per interface, because the server must know the incoming
                # interface to send replies.
                #
                # This does NOT mean the server's requests were ever gated by
                # the token. They were not: a DHCPv4 DISCOVER/REQUEST reaches
                # Kea on an AF_PACKET socket ahead of netfilter and the XDP shim
                # passes the 255.255.255.255 broadcast straight to the kernel
                # (#6460, #8060, measured on hardware). The stanza is here so
                # the authorization is expressed where Junos expresses it, and
                # so anything else on this interface that needs udp/67-68
                # delivered to the host keeps working.
                #
                # A per-interface stanza REPLACES the zone stanza (#6515), so
                # the zone's other tokens are restated here on purpose; dropping
                # any of them would narrow this interface silently.
                reth1 {
                    host-inbound-traffic {
                        system-services { ssh; ping; dhcp; dhcpv6; }
                        protocols { router-discovery; }
                    }
                }
            }
            host-inbound-traffic {
                # #3070: host-inbound is now enforced for host-bound traffic.
                #
                # These tokens do NOT gate the dhcp-local-server below, and an
                # earlier revision of this comment said they did (#8060). A
                # DHCPv4 DISCOVER is addressed to 255.255.255.255 and reaches
                # Kea on an AF_PACKET socket delivered BEFORE the netfilter
                # input hook; a DHCPv6 SOLICIT is addressed to ff02::1:2 and
                # every per-zone rule is scoped to the zone's UNICAST
                # addresses, so it matches nothing and falls through the input
                # chain's accept policy. The server answers on this interface
                # either way (#6460). See
                # validateDHCPServerHostInboundBypassWarnings (pkg/config),
                # which says this at commit, and docs/host-inbound-multicast.md.
                #
                # #8060 kept them here for "the firewall's OWN DHCP CLIENT
                # renewals on this interface". That reason does not apply to
                # THIS interface: reth1 carries a static address
                # (10.0.62.1/24) and runs no DHCP client, so a RENEWING-client
                # unicast never arrives. The reason is right in general -- a
                # renewing client's unicast udp/68 to a zone address IS
                # daddr-matched -- which is why the tokens must stay
                # EXPRESSIBLE, and it is fxp0 in this file that actually runs
                # one.
                #
                # They are kept at the zone level anyway, per #8060's non-goal:
                # they cost nothing and still cover any future member that
                # declares no stanza of its own. reth1 no longer reads them --
                # its own stanza above REPLACES the zone stanza for that
                # interface (#6515, #7490).
                system-services { ssh; ping; dhcp; dhcpv6; }
                protocols { router-discovery; }
            }
        }
    }
    policies {
        default-policy deny-all;
        from-zone lan to-zone wan {
            policy allow-all {
                match { source-address any; destination-address any; application any; }
                then { permit; log { session-init; session-close; } }
            }
        }
    }
    nat {
        # #8280: the firewall must answer ARP for pool-snat-pool's address on
        # reth0.80, or POOL-mode source-NAT return traffic blackholes.
        # 172.16.80.12 is a distinct WAN address — NOT reth0.80's own .8 —
        # because the #6751 commit gate rejects a pool that sits on an
        # interface-mode SNAT egress address: both would mint the same
        # (address, port) tuple with no shared occupancy, the #5144
        # reverse-index collision.
        #
        # NOTE the nesting: proxy-arp is a child of `nat`, not of `security`.
        # It was written one level out first, and that version COMMITTED
        # CLEAN and rendered back through `show configuration security
        # proxy-arp` while being completely inert — reconcileProxyARP reads
        # cfg.Security.NAT.ProxyARP, which stayed empty, so no kernel
        # NTF_PROXY entry was ever installed and pool return traffic
        # blackholed with no error anywhere. Measured, not guessed.
        proxy-arp {
            interface reth0.80 {
                address 172.16.80.12/32;
            }
        }
        source {
            # #8280: a POOL-mode source-NAT rule so the cluster smoke exercises
            # the port allocator at all.
            #
            # Every other source-nat rule in this file is `interface;` mode,
            # which is ADDRESS-ONLY: it rewrites the source to the egress
            # interface's own address and returns at match_rules.rs before any
            # port allocation, so it never reaches PortAllocator /
            # AddressOccupancy::claim. The consequence, measured on #7174 M13:
            # a NAT-allocator change could pass the full cluster smoke 17/17
            # while the smoke never executed a line of it — the run looks
            # identical whether the change is correct, reverted or broken.
            #
            # NON-INTERFERENCE IS BY CONSTRUCTION, not by assertion. The rule
            # matches only 10.0.62.240/28, which nothing is assigned: the LAN
            # host is .102 (tcp-userspace-cluster.env), the VIP is .1, and the
            # DHCP range is .100-.199. It is listed BEFORE the catch-all `snat`
            # rule, and first-match-wins means existing traffic never reaches
            # it. A test that wants the pool path adds a .240/28 address for the
            # duration and binds to it.
            pool pool-snat-pool {
                address 172.16.80.12/32;
                port { range 30000 to 30999; }
            }
            rule-set lan-to-wan {
                from zone lan;
                to zone wan;
                rule pool-snat {
                    match { source-address 10.0.62.240/28; }
                    then { source-nat { pool pool-snat-pool; } }
                }
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
            }
        }
    }
}
protocols {
    router-advertisement {
        interface reth1 {
            default-lifetime 180;
            max-advertisement-interval 30;
            min-advertisement-interval 10;
            prefix 2001:559:8585:aa00::/64 {
                on-link;
                autonomous;
            }
            dns-server-address 2001:4860:4860::8888;
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 { next-hop 172.16.50.1; }
        route ::/0 { next-hop 2001:559:8585:50::1; }
    }
}
system {
    name-server {
        1.1.1.1;
    }
    services {
        dhcp-local-server {
            group lan-pool {
                interface reth1.0;
                pool lan-range {
                    subnet 10.0.62.0/24;
                    address-range low 10.0.62.100 high 10.0.62.199;
                    router 10.0.62.1;
                    dns-server 8.8.8.8;
                }
            }
        }
    }
    dataplane-type userspace;
    dataplane {
        binary /usr/local/sbin/xpf-userspace-dp;
        control-socket /run/xpf/userspace-dp.sock;
        state-file /run/xpf/userspace-dp.json;
        workers 10;
        ring-entries 16384;
        poll-mode interrupt;
    }
}
