groups {
    node0 {
        system {
            host-name xpf-fw0;
        }
        chassis {
            cluster {
                node 0;
                peer-address 10.99.0.2;
                fabric-peer-address 10.99.1.2;
            }
        }
        interfaces {
            fxp0 {
                unit 0 { family inet { dhcp; } }
            }
            em0 {
                unit 0 { family inet { address 10.99.0.1/30; } }
            }
            fab0 {
                unit 0 { family inet { address 10.99.1.1/30; } }
            }
            ge-0/0/1 {
                gigether-options { redundant-parent reth1; }
            }
            ge-0/0/3 {
                gigether-options { redundant-parent reth0; }
            }
        }
    }
    node1 {
        system {
            host-name xpf-fw1;
        }
        chassis {
            cluster {
                node 1;
                peer-address 10.99.0.1;
                fabric-peer-address 10.99.1.1;
            }
        }
        interfaces {
            fxp0 {
                unit 0 { family inet { dhcp; } }
            }
            em0 {
                unit 0 { family inet { address 10.99.0.2/30; } }
            }
            fab1 {
                unit 0 { family inet { address 10.99.1.2/30; } }
            }
            ge-7/0/1 {
                gigether-options { redundant-parent reth1; }
            }
            ge-7/0/3 {
                gigether-options { redundant-parent reth0; }
            }
        }
    }
}
apply-groups "${node}";
chassis {
    cluster {
        cluster-id 1;
        # #6611: the cluster control channel (fabric gRPC, heartbeat,
        # session sync) authenticates with this shared PSK and fails OPEN
        # without it. LAB VALUE — generate your own per cluster with
        # `openssl rand -base64 32` and keep it identical on both nodes.
        authentication-key "xpf-lab-ha-psk-cluster-1-CHANGE-ME";
        reth-count 2;
        heartbeat-interval 200;
        heartbeat-threshold 5;
        control-interface em0;
        configuration-synchronize;
        redundancy-group 0 {
            node 0 priority 200;
            node 1 priority 100;

        }
        redundancy-group 1 {
            node 0 priority 200;
            node 1 priority 100;

            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/3 weight 255;
                ge-7/0/3 weight 255;
            }
        }
        redundancy-group 2 {
            node 0 priority 200;
            node 1 priority 100;

            gratuitous-arp-count 8;
            interface-monitor {
                ge-0/0/1 weight 255;
                ge-7/0/1 weight 255;
            }
        }
    }
}
interfaces {
    fab0 {
        fabric-options {
            member-interfaces {
                ge-0/0/0;
            }
        }
    }
    fab1 {
        fabric-options {
            member-interfaces {
                ge-7/0/0;
            }
        }
    }
    reth0 {
        redundant-ether-options { redundancy-group 1; }
        vlan-tagging;
        unit 50 {
            vlan-id 50;
            family inet { address 172.16.50.6/24; }
            family inet6 { address 2001:559:8585:50::6/64; }
        }
        unit 100 {
            vlan-id 100;
            family inet { address 172.16.100.6/24; }
            family inet6 { address 2001:559:8585:100::6/64; }
        }
    }
    reth1 {
        redundant-ether-options { redundancy-group 2; }
        unit 0 {
            family inet { address 10.0.60.1/24; }
            family inet6 { address 2001:559:8585:cf01::1/64; }
        }
    }
}
security {
    flow { allow-dns-reply; allow-embedded-icmp; tcp-mss { all-tcp 1396; } }
    zones {
        security-zone mgmt {
            interfaces { fxp0; }
            host-inbound-traffic { system-services { ssh; ping; dhcp; } }
        }
        security-zone control {
            interfaces { em0; fab0; fab1; }
            host-inbound-traffic { system-services { all; } }
        }
        security-zone wan {
            interfaces { reth0.50; reth0.100; }
            host-inbound-traffic {
                system-services { ping; }
                protocols { router-discovery; }
            }
        }
        security-zone lan {
            interfaces {
                # #7490: `dhcp` is admitted PER INTERFACE here, not inherited
                # from the zone. reth1 runs the dhcp-local-server below, and xpf
                # now withholds a zone-level `dhcp`/`bootp` from a DHCP
                # server/relay interface -- Junos accepts those two tokens only
                # per interface, because the server must know the incoming
                # interface to send replies.
                #
                # This does NOT mean the server's requests were ever gated by
                # the token. They were not: a DHCPv4 DISCOVER/REQUEST reaches
                # Kea on an AF_PACKET socket ahead of netfilter and the XDP shim
                # passes the 255.255.255.255 broadcast straight to the kernel
                # (#6460, #8060, measured on hardware). The stanza is here so
                # the authorization is expressed where Junos expresses it, and
                # so anything else on this interface that needs udp/67-68
                # delivered to the host keeps working.
                #
                # A per-interface stanza REPLACES the zone stanza (#6515), so
                # the zone's other tokens are restated here on purpose; dropping
                # any of them would narrow this interface silently.
                reth1 {
                    host-inbound-traffic {
                        system-services { ssh; ping; dhcp; dhcpv6; }
                        protocols { router-discovery; }
                    }
                }
            }
            host-inbound-traffic {
                # The zone-level tokens are KEPT (#8060 non-goal): they still
                # apply to any future member that declares no stanza of its own,
                # and deleting `dhcp` here would be a narrowing #8060 argues is
                # worse than the comment it replaced. reth1 no longer relies on
                # them -- the per-interface stanza above REPLACES this one for
                # that interface (#6515).
                system-services { ssh; ping; dhcp; dhcpv6; }
                protocols { router-discovery; }
            }
        }
    }
    policies {
        default-policy deny-all;
        from-zone lan to-zone wan {
            policy allow-all {
                match { source-address any; destination-address any; application any; }
                then { permit; log { session-init; session-close; } }
            }
        }
    }
    nat {
        source {
            rule-set lan-to-wan {
                from zone lan;
                to zone wan;
                rule snat {
                    match { source-address 0.0.0.0/0; }
                    then { source-nat { interface; } }
                }
                rule snat6 {
                    match { source-address ::/0; }
                    then { source-nat { interface; } }
                }
            }
        }
    }
}
protocols {
    router-advertisement {
        interface reth1 {
            managed-configuration;
            other-stateful-configuration;
            prefix 2001:559:8585:cf01::/64 {
                on-link;
                autonomous;
            }
            dns-server-address 2001:4860:4860::8888;
        }
    }
}
routing-options {
    static {
        route 0.0.0.0/0 { next-hop 172.16.50.1; }
        route ::/0 { next-hop 2001:559:8585:50::1; }
    }
}
system {
    name-server {
        1.1.1.1;
    }
    # #18584: reached through the management VRF. The default instance's
    # off-box route leaves through a RETH only the WAN owner has, so the
    # other node never synced and drifted 71 s on loss, which broke every
    # cross-node fabric RPC (30 s token window). The incus bridge gateways
    # do not serve NTP.
    ntp {
        server 162.159.200.1 routing-instance mgmt;
        server 162.159.200.123 routing-instance mgmt;
        server 91.189.91.112 routing-instance mgmt;
    }
    services {
        dhcp-local-server {
            group lan-pool {
                interface reth1;
                pool lan-range {
                    subnet 10.0.60.0/24;
                    address-range low 10.0.60.100 high 10.0.60.199;
                    router 10.0.60.1;
                    dns-server 8.8.8.8;
                }
            }
        }
        dhcpv6-local-server {
            group lan6-pool {
                interface reth1;
                pool lan6-range {
                    subnet 2001:559:8585:cf01::/64;
                    address-range low 2001:559:8585:cf01::100 high 2001:559:8585:cf01::1ff;
                    dns-server 2001:4860:4860::8888;
                }
            }
        }
    }
}
