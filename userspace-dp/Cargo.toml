[package]
name = "xpf-userspace-dp"
version = "0.1.0"
edition = "2024"

[features]
default = []
debug-log = []

[dependencies]
arc-swap = "1.7"
chrono = { version = "0.4", features = ["serde", "clock"] }
ctrlc = "3.5"
io-uring = "0.7"
ipnet = "2.10"
libbpf-sys = "~1.6"
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
rustc-hash = "2.1"
sha2 = "0.10"
slab = "0.4"
smallvec = "1.13"
# WireGuard clean-room termination (docs/pr/wireguard-clean/plan.md):
# snow provides Noise IK with explicit state machine and no hidden
# output queues. The transitive crypto set includes
# chacha20poly1305/curve25519-dalek/blake2 and ring.
snow = "0.10"
# WireGuard S1 (#1709): on-wire handshake framing + TAI64N. blake2 backs
# the MAC1 keyed-BLAKE2s-128 over HASH("mac1----"||recipient_pub) and the
# WG construction-hash KAT vectors; curve25519-dalek derives the engine's
# local static public key (MontgomeryPoint::mul_base_clamped) once at
# construction for inbound MAC1 verification. Both are already in the
# transitive crypto set via snow at these exact locked versions —
# promoting them to direct deps changes no resolved version, only the
# visibility (verified: cargo tree shows blake2 0.10.6, dalek 4.1.3).
blake2 = "0.10"
curve25519-dalek = "4.1"
# Random WG handshake indices (opaque demux tags). Already transitive via
# snow/curve25519-dalek at 0.2.x; promoted to a direct dep for the engine's
# index allocator.
getrandom = "0.2"
# zeroize is already pulled transitively by curve25519-dalek/snow; we
# pin the version we use directly for the engine's static-key state
# so the WG private key is wiped on engine drop. Cost: zero — just a
# Drop impl on a 32-byte field.
zeroize = "1.8"
# WireGuard cookie-reply / MAC2 under-load DoS mitigation (#4094, PR-A).
# The type-3 CookieReply encrypts the source-bound cookie with
# XChaCha20-Poly1305 (24-byte nonce) keyed on
# BLAKE2s-256("cookie--"||responder_static_pub) with the initiation's
# MAC1 as AEAD associated data (WG whitepaper §5.4.7). snow uses only
# the ChaChaPoly (12-byte nonce) transport AEAD, so XChaCha is a NEW
# primitive the cookie path needs. Already transitive via snow at the
# exact locked version (cargo tree: chacha20poly1305 0.10.1) — promoting
# it to a direct dep changes no resolved version, only visibility.
# `default-features = false` keeps this a subset of what snow already
# enables: XChaCha20Poly1305 + the in-place AeadInPlace/KeyInit traits
# are compiled unconditionally, so no extra features are unioned in.
chacha20poly1305 = { version = "0.10", default-features = false }

[build-dependencies]
cc = "1.2"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# #1824: in-tree property-test harness (src/afxdp/frame/prop_tests/).
# Dev-only — never links into the release binary. The `fork`/`timeout`
# features (process-forking test isolation) are deliberately dropped;
# `std` provides the proptest-regressions/ file persistence that is the
# regression-pinning mechanism (committed corpus, replayed first).
proptest = { version = "1", default-features = false, features = ["std"] }

# #825: microbench for the TX kick-latency instrumentation. Gated on
# p99 per-call overhead ≤ 60 ns per plan §7 / §3.10 R1.
[[bench]]
name = "tx_kick_latency"
harness = false

# #923: config-commit latency gate for the worst-case prefix trie
# build (256 random /32 prefixes → ~8K Box<TrieNode> allocations).
# Gated on p95 ≤ 1.5 ms (catches a 10× regression from the current
# ~150 µs working point; tightened twice from the plan's initial
# 10 ms target, see bench file header).
[[bench]]
name = "prefix_set_lookup"
harness = false

# #964 Step 1: structural microbenchmark for the SessionTable
# slab + integer-handle refactor. Reimplements the hot-path data
# shapes in this bin crate (SessionTable is pub(crate); see
# tx_kick_latency bench for the same pattern) to compare today's
# FxHashMap-of-keys layout against the slab + Key→u32 layout.
[[bench]]
name = "session_table"
harness = false

# #2852 merge-gate: SNAT PortAllocator contention microbench. Re-
# implements the current single-global-Mutex allocate shape vs the
# proposed Phase-1 lock-free per-address occupancy bitmap + tiny map
# lock (allocator.rs is pub(crate); same re-implement pattern as the
# session_table bench). `harness = false` with its own multi-threaded
# main (criterion times only single-threaded closures; a lock-
# contention gate needs M-thread p99/p999). Answers the PLAN-KILL
# question "is the global mutex a measurable bottleneck at 6-8
# workers?" across the four AGY-5 profiles.
[[bench]]
name = "snat_allocator"
harness = false

# #6592 design gate: the two costs that decided how validation and forwarding
# are paired atomically. G1 — the worker's per-tick refresh must not regress
# when two ArcSwap loads become one. G2 — a validation-only publish
# (`bump_fib_generation`) must stay ~free by REUSING the nested forwarding Arc,
# which is what preserves the #1188 short-circuit; the alternative design
# (inlining ValidationState into ForwardingState) rebuilds the whole state per
# FIB bump. `harness = false` with its own main: G2 is a ratio gate between two
# designs, not a single-closure timing.
[[bench]]
name = "runtime_view_refresh"
harness = false

# #8276: prices the IN-PROCESS half of Option B2 (the kernel -> userspace
# capture bridge for XFRM plaintext). The kernel half needs hardware; this
# bounds the userspace handoff so the design argument rests on a number.
[[bench]]
name = "b2_capture_bridge"
harness = false
